<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body>
<header th:replace="~{fragments/common/header :: header}"></header>
<th:block th:replace="~{fragments/common/alert :: popup}"></th:block>
<main class="page-container page-container--narrow">
  <section class="panel auth-card section">
    <h1>로그인</h1>
    <p class="alert alert--error" th:if="${param.error}">이메일 또는 비밀번호가 올바르지 않습니다.</p>

    <!-- 인증 과정: POST /login은 컨트롤러가 아니라 Spring Security Filter가 처리한다. -->
    <form class="form-stack" th:action="@{/login}" method="post">
      <input type="hidden" name="loginType" value="customer">
      <div class="form-group">
        <label for="email">이메일</label>
        <input id="email" class="form-control" type="email" name="email"
               th:value="${recoveredEmail}" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input id="password" class="form-control" type="password" name="password"
               autocomplete="current-password" required>
      </div>
      <label class="choice" for="remember-email">
        <input id="remember-email" type="checkbox">
        <span>이메일 기억하기</span>
      </label>
      <button class="btn btn--primary btn--block" type="submit">로그인</button>
    </form>
    <p class="alert alert--error" th:if="${param.oauthError}">소셜 로그인을 진행할 수 없습니다. 다시 시도해 주세요.</p>
    <div class="alert alert--error" th:if="${param.oauthAccountExists}">
      <p>이미 가입된 이메일입니다. 일반 로그인을 이용해 주세요.</p>
      <a class="btn" th:if="${@environment.getProperty('app.member.oauth.kakao-enabled', false)}"
         th:href="@{/oauth2/authorization/kakao(prompt=login)}">다른 카카오 계정으로 로그인</a>
    </div>
    <a class="btn btn--block" th:if="${@environment.getProperty('app.member.oauth.google-enabled', false)}"
       th:href="@{/oauth2/authorization/google}">Google로 로그인</a>
    <a class="btn btn--block" th:if="${@environment.getProperty('app.member.oauth.kakao-enabled', false)}"
       th:href="@{/oauth2/authorization/kakao(prompt=login)}">카카오로 로그인</a>
    <hr class="divider">
    <div class="cluster cluster--between">
      <a class="btn" th:href="@{/signup}">회원가입</a>
      <div class="cluster">
        <a class="btn" th:href="@{/find-email}">이메일 찾기</a>
        <a class="btn" th:href="@{/find-password}">비밀번호 찾기</a>
      </div>
    </div>
  </section>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
<script>
  const rememberedEmailKey = 'cakeshop.rememberedEmail';
  const loginForm = document.querySelector('form[action$="/login"]');
  const emailInput = document.getElementById('email');
  const rememberEmailCheckbox = document.getElementById('remember-email');

  try {
    const rememberedEmail = window.localStorage.getItem(rememberedEmailKey);
    if (rememberedEmail) {
      if (!emailInput.value) {
        emailInput.value = rememberedEmail;
      }
      rememberEmailCheckbox.checked = true;
    }
  } catch (error) {
    // 브라우저가 로컬 저장소를 차단해도 로그인 자체는 정상적으로 진행한다.
  }

  loginForm.addEventListener('submit', () => {
    try {
      if (rememberEmailCheckbox.checked) {
        window.localStorage.setItem(rememberedEmailKey, emailInput.value.trim());
      } else {
        window.localStorage.removeItem(rememberedEmailKey);
      }
    } catch (error) {
      // 저장에 실패해도 로그인 요청은 중단하지 않는다.
    }
  });
</script>
</body>
</html>
