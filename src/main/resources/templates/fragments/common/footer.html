<footer class="customer-footer" th:fragment="footer(store)">
  <div class="customer-footer__inner">
    <th:block th:if="${store != null}">
      <p><strong th:text="${store.name}">매장명</strong> |
        주소: <span th:text="${store.address}">매장 주소</span> |
        연락처: <span th:text="${store.phone}">매장 연락처</span></p>
      <p>영업시간: <span th:text="${store.businessHours}">매장 영업시간</span> |
        픽업 장소: <span th:text="${store.pickupPlace}">매장 픽업 장소</span></p>
    </th:block>
    <p th:unless="${store != null}">매장 정보를 준비 중입니다.</p>
    <p class="customer-footer__copyright">&copy; <span data-current-year>2026</span>
      <span th:if="${store != null}" th:text="${store.name}">매장명</span></p>
  </div>
</footer>
