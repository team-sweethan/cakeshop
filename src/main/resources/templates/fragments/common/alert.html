<!-- 컨트롤러는 successMessage / errorMessage 키로 플래시를 담고, 화면은 이 공통 조각에서 일괄 출력한다. -->
<div th:fragment="alert" class="flash-stack" aria-live="polite">
  <div class="alert alert--success" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="alert alert--error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
</div>

<th:block th:fragment="popup">
  <script data-common-alert-popup th:if="${successMessage}" th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
      var msg = /*[[${successMessage}]]*/ "";
      if (!msg) return;
      var targetUrl = msg.indexOf("장바구니") !== -1 ? "/cart" : null;
      if (typeof showToast === "function") {
        showToast("알림", msg, targetUrl);
      } else {
        window.alert(msg);
      }
    });
  </script>
  <script data-common-alert-popup th:if="${errorMessage}" th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
      var errMsg = /*[[${errorMessage}]]*/ "";
      if (!errMsg) return;
      if (typeof showToast === "function") {
        showToast("안내", errMsg);
      } else {
        window.alert(errMsg);
      }
    });
  </script>
</th:block>
