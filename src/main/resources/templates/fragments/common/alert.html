<!-- 컨트롤러는 successMessage / errorMessage 키로 플래시를 담고, 화면은 이 공통 조각에서 일괄 출력한다. -->
<div th:fragment="alert" class="flash-stack" aria-live="polite">
  <div class="alert alert--success" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="alert alert--error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
</div>

<th:block th:fragment="popup">
  <script data-common-alert-popup th:if="${successMessage}" th:inline="javascript">
    window.alert([[${successMessage}]]);
  </script>
  <script data-common-alert-popup th:if="${errorMessage}" th:inline="javascript">
    window.alert([[${errorMessage}]]);
  </script>
</th:block>
