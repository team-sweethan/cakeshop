<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="reviewList(reviews)" class="stack">
  <article class="panel stack" th:each="review : ${reviews}">
    <div class="cluster" style="justify-content:space-between">
      <strong th:text="${review.authorName}">작성자</strong>
      <span class="text-muted"
            th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd')}">2026-08-10</span>
    </div>

    <p class="text-muted">
      전체 <span th:text="${review.overallRating}">5</span>점 ·
      맛 <span th:text="${review.tasteRating}">5</span>점 ·
      디자인 <span th:text="${review.designRating}">5</span>점 ·
      응대 <span th:text="${review.serviceRating}">5</span>점
    </p>

    <p style="white-space:pre-wrap" th:text="${review.content}">후기 본문</p>

    <div th:replace="~{fragments/customer/product-review :: images(${review.images})}"></div>

    <div th:replace="~{fragments/customer/product-review :: reply(${review.reply})}"></div>
  </article>
</div>

<div th:fragment="images(images)" th:remove="tag">
  <div class="grid grid--3" th:if="${!#lists.isEmpty(images)}">
    <img class="placeholder-image product-card__image"
         th:each="image : ${images}"
         th:src="@{${image.imageUrl}}"
         alt="후기 첨부 이미지">
  </div>
</div>

<!-- B1 미리보기·전체 목록과 B3 가 같은 모양을 쓴다. 갈리면 상세에서 본 답글이 다른 화면에서
     달라 보인다 (DOMAIN.md 3절). -->
<div th:fragment="reply(reply)" th:remove="tag">
  <div class="panel panel--soft stack" th:if="${reply != null}">
    <div class="cluster" style="justify-content:space-between">
      <strong>사장님 답글</strong>
      <span class="text-muted"
            th:text="${#temporals.format(reply.createdAt, 'yyyy-MM-dd')}">2026-08-10</span>
    </div>

    <p style="white-space:pre-wrap" th:text="${reply.content}">답글 본문</p>
  </div>
</div>
</body>
</html>
