<aside class="admin-sidebar" th:fragment="sidebar(activeMenu)" data-account-identity th:data-member-id="${#authentication?.principal != null and #authentication.principal.toString().contains('MemberDetails') ? #authentication.principal.memberId : null}">
  <a class="admin-sidebar__brand" th:href="@{/admin}">
    <span class="admin-sidebar__eyebrow">관리자 페이지</span>
    <span class="admin-sidebar__title">케이크 쇼핑몰</span>
  </a>
  <nav class="admin-sidebar__nav" aria-label="관리자 메뉴">
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'dashboard'} ? ' is-current'"
      th:href="@{/admin}">대시보드</a>
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'store'} ? ' is-current'"
      th:href="@{/admin/store}">매장</a>
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'products'} ? ' is-current'"
      th:href="@{/admin/products}">상품</a>

    <p class="admin-sidebar__section">주문 운영</p>
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'orders'} ? ' is-current'"
      th:href="@{/admin/orders}">전체 주문</a>
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'fulfillment'} ? ' is-current'"
      th:href="@{/admin/fulfillment}">주문 처리</a>
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'payments'} ? ' is-current'"
      th:href="@{/admin/payments}">결제 기록</a>
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'coupons'} ? ' is-current'"
      th:href="@{/admin/coupons}">쿠폰</a>
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'members'} ? ' is-current'"
      th:href="@{/admin/members}">회원</a>
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'reviews'} ? ' is-current'"
      th:href="@{/admin/reviews}">후기</a>
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'community'} ? ' is-current'"
      th:href="@{/admin/community}">커뮤니티</a>
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'chat'} ? ' is-current'" th:href="@{/admin/chat}">채팅
      관리</a>
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'notifications'} ? ' is-current'"
      th:href="@{/admin/notifications}">
      알림 <span class="badge" data-unread-count style="display: none;">0</span>
    </a>
    <a class="admin-sidebar__link" th:classappend="${activeMenu == 'statistics'} ? ' is-current'"
      th:href="@{/admin/statistics}">통계</a>
  </nav>
  <script th:src="@{/js/app.js}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <script defer th:src="@{/js/notification-websocket.js}"></script>
</aside>
