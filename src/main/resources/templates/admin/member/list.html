<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리 | 관리자</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/member-admin.css}">
</head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin/sidebar :: sidebar('members')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin/header :: header('회원 관리')}"></header>
        <main class="admin-content">
            <h1 class="admin-page-title">회원 관리</h1>

            <th:block th:replace="~{fragments/common/alert :: popup}"></th:block>

            <div class="member-admin-summary">
                <nav class="member-admin-tabs" aria-label="회원 구분">
                    <a class="member-admin-tab"
                       th:classappend="${condition.members} ? ' is-current'"
                       th:href="@{/admin/members(tab='members')}">회원</a>
                    <a class="member-admin-tab"
                       th:classappend="${condition.withdrawn} ? ' is-current'"
                       th:href="@{/admin/members(tab='withdrawn')}">탈퇴</a>
                    <a class="member-admin-tab"
                       th:classappend="${condition.admins} ? ' is-current'"
                       th:href="@{/admin/members(tab='admins')}">관리자</a>
                </nav>

                <div class="member-admin-actions">
                    <div class="member-admin-result">
                        <p th:text="|총 ${pageResult.totalElements}명|">총 0명</p>
                    </div>

                    <form class="member-admin-search"
                          method="get"
                          th:action="@{/admin/members}">
                        <input type="hidden"
                               name="tab"
                               th:value="${condition.listType.queryValue}">
                        <input type="hidden"
                               name="status"
                               th:if="${condition.status != null}"
                               th:value="${condition.status}">
                        <input class="form-control"
                               name="keyword"
                               th:value="${condition.keyword}"
                               aria-label="회원 검색"
                               placeholder="이름·이메일·전화번호 검색">
                        <button class="btn" type="submit">검색</button>
                        <a class="btn btn--outline"
                           th:href="@{/admin/members(tab=${condition.listType.queryValue})}">
                            초기화
                        </a>
                    </form>
                </div>
            </div>

            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>전화번호</th>
                        <th>생년월일</th>
                        <th>가입일</th>
                        <th th:if="${condition.withdrawn}">탈퇴일</th>
                        <th class="member-admin-status-column"
                            th:unless="${condition.withdrawn}">
                            <div class="member-admin-status-heading">
                                <span>상태</span>
                                <form method="get"
                                      th:action="@{/admin/members}"
                                      th:if="${condition.members}">
                                    <input type="hidden"
                                           name="tab"
                                           th:value="${condition.listType.queryValue}">
                                    <input type="hidden"
                                           name="keyword"
                                           th:value="${condition.keyword}">
                                    <select class="form-control"
                                            name="status"
                                            aria-label="회원 상태"
                                            onchange="this.form.submit()">
                                        <option value="">상태 전체</option>
                                        <option th:each="memberStatus : ${memberStatuses}"
                                                th:value="${memberStatus}"
                                                th:selected="${condition.status == memberStatus}"
                                                th:text="${memberStatus.name() == 'ACTIVE' ? '정상' : '이용정지'}">
                                        </option>
                                    </select>
                                </form>
                            </div>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="member : ${pageResult.content}">
                        <td>
                            <a class="member-admin-name-link"
                               th:href="@{/admin/members/{memberId}(memberId=${member.id})}"
                               th:text="${member.name ?: '-'}">
                                회원 이름
                            </a>
                        </td>
                        <td th:text="${member.maskedEmail}">su***@example.com</td>
                        <td th:text="${member.maskedPhone}">010-****-1234</td>
                        <td th:text="${member.maskedBirthDate}">2000.**.**</td>
                        <td th:text="${#temporals.format(member.createdAt, 'yyyy.MM.dd')}">
                            2026.07.30
                        </td>
                        <td th:if="${condition.withdrawn}"
                            th:text="${member.withdrawnAt == null
                                ? '-'
                                : #temporals.format(member.withdrawnAt, 'yyyy.MM.dd')}">
                            2026.07.30
                        </td>
                        <td class="member-admin-status-column"
                            th:unless="${condition.withdrawn}">
                            <div class="member-admin-status-actions">
                                <span class="badge"
                                      th:classappend="${member.status.name() == 'ACTIVE'}
                                          ? ' badge--success'
                                          : ' badge--danger'"
                                      th:text="${member.status.name() == 'ACTIVE'}
                                          ? '정상'
                                          : '이용정지'">
                                    정상
                                </span>

                                <button class="btn btn--danger member-admin-status-action"
                                        type="button"
                                        th:if="${condition.members
                                            and member.status.name() == 'ACTIVE'}"
                                        th:attr="data-modal-open=|member-suspend-modal-${member.id}|">
                                    이용정지
                                </button>

                                <button class="btn btn--primary member-admin-status-action"
                                        type="button"
                                        th:if="${condition.members
                                            and member.status.name() == 'SUSPENDED'}"
                                        th:attr="data-modal-open=|member-activate-modal-${member.id}|">
                                    정지 해제
                                </button>
                            </div>

                            <div class="modal"
                                 hidden
                                 th:if="${condition.members
                                     and member.status.name() == 'ACTIVE'}"
                                 th:id="|member-suspend-modal-${member.id}|">
                                <div class="modal__dialog"
                                     role="dialog"
                                     aria-modal="true"
                                     th:attr="aria-labelledby=|member-suspend-title-${member.id}|">
                                    <h2 class="member-admin-modal-title"
                                        th:id="|member-suspend-title-${member.id}|">
                                        회원 이용정지
                                    </h2>
                                    <p class="member-admin-modal-description">
                                        이용정지 사유를 입력해 주세요.
                                    </p>

                                    <form method="post"
                                          th:action="@{/admin/members/{memberId}/suspend(
                                              memberId=${member.id}
                                          )}">
                                        <div class="form-group">
                                            <label th:for="|suspend-reason-${member.id}|">
                                                이용정지 사유
                                            </label>
                                            <textarea class="form-control member-admin-modal-reason"
                                                      name="reason"
                                                      rows="4"
                                                      required
                                                      maxlength="500"
                                                      placeholder="회원 이용을 정지하는 사유를 입력해 주세요."
                                                      th:id="|suspend-reason-${member.id}|"></textarea>
                                        </div>

                                        <div class="cluster">
                                            <button class="btn btn--danger"
                                                    type="submit">
                                                이용정지
                                            </button>
                                            <button class="btn btn--outline"
                                                    type="button"
                                                    data-modal-close>
                                                취소
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <div class="modal"
                                 hidden
                                 th:if="${condition.members
                                     and member.status.name() == 'SUSPENDED'}"
                                 th:id="|member-activate-modal-${member.id}|">
                                <div class="modal__dialog"
                                     role="dialog"
                                     aria-modal="true"
                                     th:attr="aria-labelledby=|member-activate-title-${member.id}|">
                                    <h2 class="member-admin-modal-title"
                                        th:id="|member-activate-title-${member.id}|">
                                        회원 이용정지 해제
                                    </h2>
                                    <p class="member-admin-modal-description">
                                        이용정지 해제 사유를 입력해 주세요.
                                    </p>

                                    <form method="post"
                                          th:action="@{/admin/members/{memberId}/activate(
                                              memberId=${member.id}
                                          )}">
                                        <div class="form-group">
                                            <label th:for="|activate-reason-${member.id}|">
                                                이용정지 해제 사유
                                            </label>
                                            <textarea class="form-control member-admin-modal-reason"
                                                      name="reason"
                                                      rows="4"
                                                      required
                                                      maxlength="500"
                                                      placeholder="회원 이용정지를 해제하는 사유를 입력해 주세요."
                                                      th:id="|activate-reason-${member.id}|"></textarea>
                                        </div>

                                        <div class="cluster">
                                            <button class="btn btn--primary"
                                                    type="submit">
                                                정지 해제
                                            </button>
                                            <button class="btn btn--outline"
                                                    type="button"
                                                    data-modal-close>
                                                취소
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${pageResult.content.isEmpty()}">
                        <td colspan="6">조건에 맞는 회원이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav class="cluster"
                 th:if="${pageResult.totalPages > 1}"
                 aria-label="회원 목록 페이지">
                <a class="btn btn--outline"
                   th:if="${pageResult.page > 1}"
                   th:href="@{/admin/members(
                       tab=${condition.listType.queryValue},
                       keyword=${condition.keyword},
                       status=${condition.status},
                       page=${pageResult.page - 1},
                       size=${pageResult.size}
                   )}">
                    이전
                </a>
                <span th:text="|${pageResult.page} / ${pageResult.totalPages}|">1 / 1</span>
                <a class="btn btn--outline"
                   th:if="${pageResult.page < pageResult.totalPages}"
                   th:href="@{/admin/members(
                       tab=${condition.listType.queryValue},
                       keyword=${condition.keyword},
                       status=${condition.status},
                       page=${pageResult.page + 1},
                       size=${pageResult.size}
                   )}">
                    다음
                </a>
            </nav>
        </main>
    </div>
</div>
<script th:src="@{/js/member-admin.js}"></script>
</body>
</html>
