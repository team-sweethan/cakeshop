<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제작·픽업 관리 | 관리자</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{fragments/admin/sidebar :: sidebar('fulfillment')}"></aside>
  <div class="admin-main">
    <header th:replace="~{fragments/admin/header :: header('제작·픽업 관리')}"></header>
    <main class="admin-content">
      <div th:replace="~{fragments/common/alert :: alert}"></div>
      <h1 class="admin-page-title">제작·픽업 관리</h1>

      <form class="admin-toolbar" method="get" th:action="@{/admin/fulfillment}">
        <input class="form-control" id="pickupDate" name="pickupDate" type="date"
               aria-label="픽업 날짜"
               th:value="${fulfillment.pickupDate}">
        <select class="form-control" id="status" name="status" aria-label="주문 상태">
          <option value="" th:selected="${fulfillment.selectedStatus == null}">전체 상태</option>
          <option value="UNDER_REVIEW"
                  th:selected="${fulfillment.selectedStatus != null
                      and fulfillment.selectedStatus.name() == 'UNDER_REVIEW'}">승인 대기</option>
          <option value="IN_PRODUCTION"
                  th:selected="${fulfillment.selectedStatus != null
                      and fulfillment.selectedStatus.name() == 'IN_PRODUCTION'}">제작 중</option>
          <option value="READY_FOR_PICKUP"
                  th:selected="${fulfillment.selectedStatus != null
                      and fulfillment.selectedStatus.name() == 'READY_FOR_PICKUP'}">픽업 준비</option>
          <option value="PICKED_UP"
                  th:selected="${fulfillment.selectedStatus != null
                      and fulfillment.selectedStatus.name() == 'PICKED_UP'}">픽업 완료</option>
        </select>
        <button class="btn btn--primary" type="submit">조회</button>
      </form>

      <div class="panel empty-state"
           th:if="${#lists.isEmpty(fulfillment.orders)}">
        선택한 날짜에 제작·픽업 주문이 없습니다.
      </div>

      <div class="fulfillment-list"
           th:unless="${#lists.isEmpty(fulfillment.orders)}">
        <details class="fulfillment-order"
                 th:each="order : ${fulfillment.orders}"
                 th:id="|fulfillment-order-${order.orderId}|"
                 th:attr="data-order-id=${order.orderId}">
          <summary class="fulfillment-order__summary">
            <span class="fulfillment-order__identity">
              <strong th:text="${order.pickupName}">픽업자 이름</strong>
              <span class="text-muted"
                    th:text="|${order.orderNumber} · 주문 ID #${order.orderId}|">
                ORD-001 · 주문 ID #1
              </span>
            </span>
            <span class="fulfillment-order__meta">
              <strong th:text="${#temporals.format(order.pickupAt, 'HH:mm')}">14:00</strong>
              <span th:text="${order.orderTypeLabel}">일반 상품</span>
              <span class="badge" th:classappend="${order.statusClass}"
                    th:text="${order.statusLabel}">픽업 준비</span>
            </span>
          </summary>

          <div class="fulfillment-order__body">
            <div class="fulfillment-order__section">
              <h2 class="section-title">픽업자 연락처</h2>
              <strong th:text="${order.pickupName}">픽업자</strong>
              <p class="text-muted" th:text="${order.pickupPhone}">010-0000-0000</p>
            </div>

            <div class="fulfillment-order__section">
              <h2 class="section-title">상품·옵션</h2>
              <div class="fulfillment-order__item" th:each="item : ${order.items}">
                <strong th:text="${item.productName + ' × ' + item.quantity}">상품명 × 1</strong>
                <p class="text-muted" th:text="${item.optionSummary}">기본</p>
              </div>
              <span th:if="${#lists.isEmpty(order.items)}">주문 상품 없음</span>
            </div>

            <div class="fulfillment-order__actions">
              <a class="btn"
                 th:href="@{/admin/orders/{id}(id=${order.orderId})}">주문 상세</a>
              <form th:if="${order.productionStartable}" method="post"
                    th:action="@{/admin/fulfillment/{id}/production/start(id=${order.orderId})}">
                <input type="hidden" name="pickupDate" th:value="${fulfillment.pickupDate}">
                <input type="hidden" name="status"
                       th:if="${fulfillment.selectedStatus != null}"
                       th:value="${fulfillment.selectedStatus}">
                <button class="btn btn--primary" type="submit"
                        data-confirm="제작을 시작하면 고객 취소가 불가능합니다. 계속하시겠습니까?">
                  제작 승인·시작
                </button>
              </form>
              <form class="stack" th:if="${order.rejectionAvailable}" method="post"
                    th:action="@{/admin/fulfillment/{id}/reject(id=${order.orderId})}">
                <input type="hidden" name="pickupDate" th:value="${fulfillment.pickupDate}">
                <input type="hidden" name="status"
                       th:if="${fulfillment.selectedStatus != null}"
                       th:value="${fulfillment.selectedStatus}">
                <textarea class="form-control form-control--textarea" name="reason"
                          maxlength="200" required placeholder="반려 사유"></textarea>
                <button class="btn btn--danger" type="submit"
                        data-confirm="주문을 반려하고 결제를 환불하시겠습니까?">
                  반려·환불
                </button>
              </form>
              <form th:if="${order.productionCompletable}" method="post"
                    th:action="@{/admin/fulfillment/{id}/production/complete(id=${order.orderId})}">
                <input type="hidden" name="pickupDate" th:value="${fulfillment.pickupDate}">
                <input type="hidden" name="status"
                       th:if="${fulfillment.selectedStatus != null}"
                       th:value="${fulfillment.selectedStatus}">
                <button class="btn btn--primary" type="submit"
                        data-confirm="제작을 완료하고 픽업 대기로 변경하시겠습니까?">
                  제작 완료
                </button>
              </form>
              <form th:if="${order.pickupCompletable}" method="post"
                    th:action="@{/admin/fulfillment/{id}/pickup(id=${order.orderId})}">
                <input type="hidden" name="pickupDate" th:value="${fulfillment.pickupDate}">
                <input type="hidden" name="status"
                       th:if="${fulfillment.selectedStatus != null}"
                       th:value="${fulfillment.selectedStatus}">
                <button class="btn btn--primary" type="submit"
                        data-confirm="픽업 완료 처리 후에는 되돌릴 수 없습니다. 처리하시겠습니까?">
                  픽업 완료 처리
                </button>
              </form>
            </div>
          </div>
        </details>
      </div>
    </main>
  </div>
</div>
</body>
</html>
