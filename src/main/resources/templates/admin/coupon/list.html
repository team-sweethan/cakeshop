<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common/head :: head('쿠폰 관리 | 관리자')}"></head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin/sidebar :: sidebar('coupons')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin/header :: header('쿠폰 관리')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/common/alert :: alert}"></div>

            <div class="cluster cluster--between">
                <h1 class="admin-page-title">쿠폰 관리</h1>
                <button class="btn btn--primary" type="button" th:onclick="|location.href='@{/admin/coupons/create}'|">+
                    쿠폰 등록
                </button>
            </div>

            <form class="panel"
                  method="get"
                  th:action="@{/admin/coupons}"
                  th:object="${condition}"
                  style="margin-bottom: 16px">

                <div class="grid grid--2">
                    <div class="form-group">
                        <label for="keyword">쿠폰명 검색</label>

                        <input id="keyword"
                               class="form-control"
                               th:field="*{keyword}"
                               placeholder="쿠폰명을 입력하세요">
                    </div>

                    <div class="form-group">
                        <label for="status">상태</label>

                        <select id="status"
                                class="form-control"
                                th:field="*{status}">
                            <option value="">전체 상태</option>
                            <option value="SCHEDULED">발급 예정</option>
                            <option value="ACTIVE">발급 중</option>
                            <option value="INACTIVE">발급 중지</option>
                            <option value="EXHAUSTED">수량 소진</option>
                            <option value="ENDED">종료</option>
                        </select>
                    </div>
                </div>

                <div class="cluster">
                    <button class="btn btn--primary" type="submit">
                        검색
                    </button>

                    <a class="btn" th:href="@{/admin/coupons}">
                        초기화
                    </a>
                </div>
            </form>

            <!-- 검색 조건이 적용된 전체 결과 건수를 검색 영역과 목록 사이에 표시한다. -->
            <p class="text-muted">총<strong th:text="${pageResult.totalElements}">0</strong>건</p>

            <div class="table-wrap section">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>번호</th>
                        <th>쿠폰명</th>
                        <th>할인 유형</th>
                        <th>할인값</th>
                        <th>발급 수량</th>
                        <th>사용 기간</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${pageResult.totalElements == 0}">
                        <td colspan="8">
                            검색 조건에 맞는 쿠폰이 없습니다.
                        </td>
                    </tr>

                    <tr th:each="coupon : ${pageResult.content}">
                        <td th:text="${coupon.id}">1</td>

                        <td>
                            <a th:href="@{/admin/coupons/{couponId}/detail(
                                   couponId=${coupon.id},
                                   keyword=${condition.keyword},
                                   status=${condition.status},
                                   page=${pageResult.page}
                               )}"
                               th:text="${coupon.name}">
                                첫 주문 할인 쿠폰
                            </a>
                        </td>

                        <td th:switch="${coupon.discountType}">
                            <span th:case="'FIXED_AMOUNT'">금액 할인</span>
                            <span th:case="'PERCENTAGE'">비율 할인</span>
                        </td>

                        <td th:switch="${coupon.discountType}">
                            <span th:case="'FIXED_AMOUNT'"
                                  th:text="|${#numbers.formatInteger(coupon.discountValue, 0, 'COMMA')}원|">
                                5,000원
                            </span>

                            <span th:case="'PERCENTAGE'"
                                  th:text="|${coupon.discountValue}%|">
                                10%
                            </span>
                        </td>

                        <td th:text="|${coupon.issuedQuantity} / ${coupon.totalQuantity == null ? '제한 없음' : coupon.totalQuantity}|">0 / 100</td>

                        <td>
                            <span th:text="${#temporals.format(coupon.startsAt,'yyyy-MM-dd HH:mm')}">2026-07-01 00:00</span>
                            ~
                            <span th:text="${#temporals.format(coupon.expiresAt,'yyyy-MM-dd HH:mm')}">2026-07-31 23:59</span>
                        </td>

                        <td th:switch="${#strings.toString(coupon.displayStatus)}">
                            <span th:case="'SCHEDULED'" class="badge badge--info" th:text="${coupon.displayStatus.description}">발급 예정</span>
                            <span th:case="'ACTIVE'" class="badge badge--success" th:text="${coupon.displayStatus.description}">발급 중</span>
                            <span th:case="'INACTIVE'" class="badge badge--warning" th:text="${coupon.displayStatus.description}">발급 중지</span>
                            <span th:case="'EXHAUSTED'" class="badge badge--warning" th:text="${coupon.displayStatus.description}">수량 소진</span>
                            <span th:case="'ENDED'" class="badge badge--danger" th:text="${coupon.displayStatus.description}">종료</span>
                        </td>

                        <td>
                            <div class="cluster">
                                <a class="btn" th:if="${#strings.toString(coupon.displayStatus) != 'ENDED'}"
                                   th:href="@{/admin/coupons/{couponId}/edit(couponId=${coupon.id}, keyword=${condition.keyword}, status=${condition.status}, page=${pageResult.page}, origin='LIST')}">수정</a>

                                <form th:if="${#strings.toString(coupon.adminStatus) == 'ACTIVE'
                                        && #strings.toString(coupon.displayStatus) != 'ENDED'}"
                                      th:action="@{/admin/coupons/{couponId}/deactivate(couponId=${coupon.id})}"
                                      method="post">
                                    <input type="hidden" name="keyword" th:value="${condition.keyword}">
                                    <input type="hidden" name="status" th:value="${condition.status}">
                                    <input type="hidden" name="page" th:value="${pageResult.page}">

                                    <button class="btn btn--danger" type="submit">발급 중지</button>
                                </form>

                                <form th:if="${#strings.toString(coupon.adminStatus) == 'INACTIVE'
                                        && #strings.toString(coupon.displayStatus) != 'ENDED'}"
                                      th:action="@{/admin/coupons/{couponId}/activate(couponId=${coupon.id})}"
                                      method="post">
                                    <input type="hidden" name="keyword" th:value="${condition.keyword}">
                                    <input type="hidden" name="status" th:value="${condition.status}">
                                    <input type="hidden" name="page" th:value="${pageResult.page}">

                                    <button class="btn btn--success" type="submit">발급 재개</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav
                 class="cluster"
                 aria-label="페이지 이동"
                 style="justify-content: center; margin-top: 16px">

                <!-- 이전/다음은 한 페이지씩이 아니라 현재 번호 블록 단위로 이동한다. -->
                <a class="btn"
                   th:if="${pageNavigation.hasPreviousBlock}"
                   th:href="@{/admin/coupons(
                   keyword=${condition.keyword},
                   status=${condition.status},
                   page=${pageNavigation.previousPage}
               )}">
                    이전
                </a>

                <!-- startPage부터 endPage까지만 렌더링해 전체 페이지 번호 노출을 막는다. -->
                <a class="btn"
                   th:each="pageNumber :
                   ${#numbers.sequence(
                       pageNavigation.startPage,
                       pageNavigation.endPage
                   )}"
                   th:text="${pageNumber}"
                   th:classappend="${pageNumber == pageResult.page}
                   ? ' is-active'"
                   th:href="@{/admin/coupons(
                   keyword=${condition.keyword},
                   status=${condition.status},
                   page=${pageNumber}
               )}">
                    1
                </a>

                <a class="btn"
                   th:if="${pageNavigation.hasNextBlock}"
                   th:href="@{/admin/coupons(
                   keyword=${condition.keyword},
                   status=${condition.status},
                   page=${pageNavigation.nextPage}
               )}">
                    다음
                </a>

            </nav>
        </main>
    </div>
</div>
</body>
</html>
