<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common/head :: head('쿠폰 관리 | 관리자')}"></head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin/sidebar :: sidebar('coupons')}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin/header :: header('쿠폰 관리')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin/mock-notice :: notice}"></div>
            <div th:replace="~{fragments/common/alert :: alert}"></div>

            <div class="cluster cluster--between">
                <h1 class="admin-page-title">쿠폰 관리</h1>
                <button class="btn btn--primary" type="button" th:onclick="|location.href='@{/admin/coupons/create}'|">+ 쿠폰 등록</button>
            </div>

            <form class="panel"
                  method="get"
                  th:action="@{/admin/coupons}"
                  th:object="${condition}"
                  style="margin-bottom: 16px">

                <div class="grid grid--2">
                    <div class="form-group">
                        <label for="keyword">쿠폰명 검색</label>

                        <input id="keyword"
                               class="form-control"
                               th:field="*{keyword}"
                               placeholder="쿠폰명을 입력하세요">
                    </div>

                    <div class="form-group">
                        <label for="status">상태</label>

                        <select id="status"
                                class="form-control"
                                th:field="*{status}">
                            <option value="">전체 상태</option>
                            <option value="ACTIVE">발급 중</option>
                            <option value="INACTIVE">발급 중지</option>
                            <option value="ENDED">종료</option>
                        </select>
                    </div>
                </div>

                <div class="cluster">
                    <button class="btn btn--primary" type="submit">
                        검색
                    </button>

                    <a class="btn" th:href="@{/admin/coupons}">
                        초기화
                    </a>
                </div>
            </form>

            <div class="table-wrap section">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>번호</th>
                        <th>쿠폰명</th>
                        <th>할인 유형</th>
                        <th>할인값</th>
                        <th>발급 수량</th>
                        <th>사용 기간</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${pageResult.totalElements == 0}">
                        <td colspan="8">
                            검색 조건에 맞는 쿠폰이 없습니다.
                        </td>
                    </tr>

                    <tr th:each="coupon : ${pageResult.content}">
                        <td th:text="${coupon.id}">1</td>

                        <td th:text="${coupon.name}">
                            첫 주문 할인 쿠폰
                        </td>

                        <td th:switch="${coupon.discountType}">
                            <span th:case="'FIXED_AMOUNT'">금액 할인</span>
                            <span th:case="'PERCENTAGE'">비율 할인</span>
                        </td>

                        <td th:switch="${coupon.discountType}">
                            <span th:case="'FIXED_AMOUNT'"
                                  th:text="|${#numbers.formatInteger(coupon.discountValue, 0, 'COMMA')}원|">
                                5,000원
                            </span>

                            <span th:case="'PERCENTAGE'"
                                  th:text="|${coupon.discountValue}%|">
                                10%
                            </span>
                        </td>

                        <td th:text="|${coupon.issuedQuantity} / ${coupon.totalQuantity}|">0 / 100</td>

                        <td>
                            <span th:text="${#temporals.format(coupon.startsAt,'yyyy-MM-dd HH:mm')}">2026-07-01 00:00</span>
                            ~
                            <span th:text="${#temporals.format(coupon.expiresAt,'yyyy-MM-dd HH:mm')}">2026-07-31 23:59</span>
                        </td>

                        <td th:switch="${coupon.status}">
                            <span th:case="'ACTIVE'" class="badge badge--success">발급 중</span>
                            <span th:case="'INACTIVE'" class="badge badge--warning">발급 중지</span>
                            <span th:case="'ENDED'" class="badge badge--danger">종료</span>
                        </td>

                        <td>
                            <div class="cluster">
                                <a class="btn" th:href="@{/admin/coupons/{couponId}/edit(couponId=${coupon.id})}">수정</a>

                                <form th:if="${coupon.status == 'ACTIVE'}"
                                      th:action="@{/admin/coupons/{couponId}/deactivate(couponId=${coupon.id})}"
                                      method="post">

                                    <button class="btn btn--danger" type="submit">발급 중지</button>
                                </form>

                                <form th:if="${coupon.status == 'INACTIVE'}"
                                      th:action="@{/admin/coupons/{couponId}/activate(couponId=${coupon.id})}"
                                      method="post">

                                    <button class="btn btn--success" type="submit" >발급 재개</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${pageResult.totalPages > 1}"
                 class="cluster"
                 aria-label="페이지 이동"
                 style="justify-content: center; margin-top: 16px">

                <a class="btn"
                   th:if="${pageResult.page > 1}"
                   th:href="@{/admin/coupons(
                   keyword=${condition.keyword},
                   status=${condition.status},
                   page=${pageResult.page - 1},
                   size=${pageResult.size}
                   )}">
                    이전
                </a>

                <span class="btn btn--disabled" th:unless="${pageResult.page > 1}">이전</span>

                <a class="btn"
                   th:each="pageNumber :
               ${#numbers.sequence(1, pageResult.totalPages)}"
                   th:text="${pageNumber}"
                   th:classappend="${pageNumber == pageResult.page}
               ? ' is-active'"
                   th:href="@{/admin/coupons(
                   keyword=${condition.keyword},
                   status=${condition.status},
                   page=${pageNumber},
                   size=${pageResult.size})}">
                    1
                </a>

                <a class="btn"
                   th:if="${pageResult.page < pageResult.totalPages}"
                   th:href="@{/admin/coupons(
                   keyword=${condition.keyword},
                   status=${condition.status},
                   page=${pageResult.page + 1},
                   size=${pageResult.size})}">
                    다음
                </a>

                <span class="btn btn--disabled" th:unless="${pageResult.page < pageResult.totalPages}">다음</span>
            </nav>
        </main>
    </div>
</div>
</body>
</html>
