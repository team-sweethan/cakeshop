<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common/head :: head('쿠폰 상세 정보 | 관리자')}"></head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin/sidebar :: sidebar('coupons')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin/header :: header('쿠폰 관리')}"></header>
        <main class="admin-content" data-coupon-detail
              th:attr="data-coupon-id=${couponId},data-keyword=${condition.keyword},data-status=${condition.status},data-discount-type-filter=${condition.discountTypeFilter},data-target-type-filter=${condition.targetTypeFilter},data-period-start=${condition.periodStart},data-period-end=${condition.periodEnd},data-page=${page},data-csrf-name=${_csrf.parameterName},data-csrf-token=${_csrf.token},data-specific-members=${couponDetail.targetType.name() == 'SPECIFIC_MEMBERS'}">
            <div th:replace="~{fragments/common/alert :: alert}"></div>
            <h1 class="admin-page-title">쿠폰 상세 정보</h1>

            <div class="panel">
                <div class="form-group"><label for="name">쿠폰명</label><input id="name" class="form-control"
                                                                            th:value="${couponDetail.name}" disabled>
                </div>
                <div class="grid grid--2">
                    <div class="form-group"><label for="discountType">할인 유형</label><input id="discountType"
                                                                                          class="form-control"
                                                                                          th:value="${couponDetail.discountType.name() == 'FIXED_AMOUNT' ? '금액 할인' : '비율 할인'}"
                                                                                          disabled></div>
                    <div class="form-group"><label for="discountValue">할인값</label><input id="discountValue"
                                                                                         class="form-control"
                                                                                         th:value="${couponDetail.discountValue}"
                                                                                         disabled></div>
                </div>
                <div class="grid grid--2">
                    <div class="form-group"><label for="minimumOrderAmount">최소 주문 금액</label><input
                            id="minimumOrderAmount" class="form-control" th:value="${couponDetail.minimumOrderAmount}"
                            disabled></div>
                    <div class="form-group"><label for="maximumDiscountAmount">최대 할인 금액</label><input
                            id="maximumDiscountAmount" class="form-control"
                            th:value="${couponDetail.maximumDiscountAmount}" disabled></div>
                </div>
                <div class="grid grid--2">
                    <div class="form-group"><label for="startsAt">시작 일시</label><input id="startsAt" class="form-control"
                                                                                      type="datetime-local"
                                                                                      th:value="${#temporals.format(couponDetail.startsAt, 'yyyy-MM-dd''T''HH:mm')}"
                                                                                      disabled></div>
                    <div class="form-group"><label for="expiresAt">종료 일시</label><input id="expiresAt"
                                                                                       class="form-control"
                                                                                       type="datetime-local"
                                                                                       th:value="${#temporals.format(couponDetail.expiresAt, 'yyyy-MM-dd''T''HH:mm')}"
                                                                                       disabled></div>
                </div>
                <div class="grid grid--2">
                    <div class="form-group"><label for="targetType">발급 대상</label><input id="targetType"
                                                                                        class="form-control"
                                                                                        th:value="${couponDetail.targetType.description}"
                                                                                        disabled></div>
                    <div class="form-group"><label for="displayStatus">상태</label><input id="displayStatus"
                                                                                        class="form-control"
                                                                                        th:value="${couponDetail.displayStatus.description}"
                                                                                        disabled></div>
                </div>
                <div class="grid grid--2">
                    <div class="form-group"><label for="totalQuantity">총 발급 수량</label><input id="totalQuantity"
                                                                                             class="form-control"
                                                                                             th:value="${couponDetail.totalQuantity == null ? '제한 없음' : couponDetail.totalQuantity}"
                                                                                             disabled></div>
                    <div class="form-group"><label for="issuedQuantity">발급 수량</label><input id="issuedQuantity"
                                                                                            class="form-control"
                                                                                            th:value="${couponDetail.issuedQuantity}"
                                                                                            disabled></div>
                </div>
                <div class="cluster">
                    <a class="btn btn--primary" th:if="${couponDetail.displayStatus.name() != 'ENDED'}"
                       th:href="@{/admin/coupons/{couponId}/edit(couponId=${couponId}, keyword=${condition.keyword}, status=${condition.status}, discountTypeFilter=${condition.discountTypeFilter}, targetTypeFilter=${condition.targetTypeFilter}, periodStart=${condition.periodStart}, periodEnd=${condition.periodEnd}, page=${page}, origin='DETAIL')}">수정</a>
                    <a class="btn"
                       th:href="@{/admin/coupons(keyword=${condition.keyword}, status=${condition.status}, discountTypeFilter=${condition.discountTypeFilter}, targetTypeFilter=${condition.targetTypeFilter}, periodStart=${condition.periodStart}, periodEnd=${condition.periodEnd}, page=${page})}">목록</a>
                </div>
            </div>

            <div class="panel" style="margin-top: 24px;"
                 th:if="${couponDetail.targetType.name() == 'SPECIFIC_MEMBERS'}">
                <h2 class="section-title" style="margin: 0 0 16px; font-size: 1.25rem;">쿠폰 개별 발급</h2>
                <p class="form-help">발급 예정 쿠폰도 미리 지급할 수 있으며, 회원은 시작 일시 이후부터 사용할 수 있습니다.</p>
                <div class="cluster" style="gap: 8px; margin-top: 8px;">
                    <select id="targetMemberSearchType" class="form-select" style="max-width: 130px;height: 37px;">
                    <option value="MEMBER_ID">회원 ID</option>
                    <option value="NAME" selected>이름</option>
                    <option value="EMAIL">이메일</option>
                    <option value="PHONE">휴대폰 번호</option>
                </select><input id="targetMemberSearch"
                                class="form-control"
                                style="flex: 1; max-width: 400px;"
                                placeholder="회원 이름 또는 이메일 입력">
                    <button class="btn" type="button" id="targetMemberSearchButton">검색</button>
                    <button class="btn" type="button" id="targetMemberResetButton">초기화</button>
                </div>
                <div class="table-wrap" style="margin-top: 16px;">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>회원 ID</th>
                            <th>이름</th>
                            <th>이메일</th>
                            <th>휴대폰 번호</th>
                            <th>생일</th>
                            <th>발급 상태</th>
                            <th>관리</th>
                        </tr>
                        </thead>
                        <tbody id="targetMemberResults"></tbody>
                    </table>
                </div>
                <nav id="targetMemberPagination" class="cluster"
                     style="justify-content: center; margin-top: 12px;"></nav>
            </div>

            <div class="panel" style="margin-top: 24px;">
                <h2 class="section-title" style="margin: 0 0 16px; font-size: 1.25rem;">발급 회원 목록</h2>
                <div class="cluster" style="gap: 8px; margin-bottom: 12px;"><input id="issuedMemberSearch"
                                                                                   class="form-control"
                                                                                   style="flex: 1; max-width: 400px;"
                                                                                   placeholder="회원 ID 입력">
                    <button class="btn" type="button" id="issuedMemberSearchButton">검색</button>
                    <button class="btn" type="button" id="issuedMemberResetButton">초기화</button>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>회원 ID</th>
                            <th>이름</th>
                            <th>이메일</th>
                            <th>휴대폰 번호</th>
                            <th>생일</th>
                            <th>사용</th>
                            <th>사용 일시</th>
                            <th th:if="${couponDetail.targetType.name() == 'SPECIFIC_MEMBERS'}">관리</th>
                        </tr>
                        </thead>
                        <tbody id="issuedMemberResults"></tbody>
                    </table>
                </div>
                <nav id="issuedMemberPagination" class="cluster"
                     style="justify-content: center; margin-top: 12px;"></nav>
            </div>
        </main>
    </div>
</div>
<script defer th:src="@{/js/coupon-detail.js}"></script>
</body>
</html>
