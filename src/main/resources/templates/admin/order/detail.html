<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 상세 | 관리자</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{fragments/admin/sidebar :: sidebar('orders')}"></aside>
  <div class="admin-main">
    <header th:replace="~{fragments/admin/header :: header('주문 상세')}"></header>
    <main class="admin-content">
      <div class="cluster cluster--between section">
        <h1 class="admin-page-title" th:text="'주문 상세 - ' + ${order.orderNumber}">주문 상세</h1>
        <a class="btn" th:href="@{/admin/orders}">목록으로</a>
      </div>
      <div class="grid grid--2">
        <div class="stack">
          <section><h2 class="section-title">주문자·픽업 정보</h2><div class="panel">
            <div class="data-row"><span class="data-row__label">주문자</span><span th:text="${order.ordererName}">주문자</span></div>
            <div class="data-row"><span class="data-row__label">주문자 연락처</span><span th:text="${order.ordererPhone}">연락처</span></div>
            <div class="data-row"><span class="data-row__label">픽업자</span><span th:text="${order.pickupName}">픽업자</span></div>
            <div class="data-row"><span class="data-row__label">픽업 연락처</span><span th:text="${order.pickupPhone}">연락처</span></div>
            <div class="data-row"><span class="data-row__label">픽업 일시</span><span th:text="${#temporals.format(order.pickupAt, 'yyyy.MM.dd HH:mm')}">픽업 일시</span></div>
          </div></section>
          <section><h2 class="section-title">주문 상품</h2>
            <article class="panel" th:each="item : ${order.items}">
              <strong th:text="${item.productName}">상품명</strong>
              <p th:text="${item.quantity + '개 · ' + #numbers.formatInteger(item.totalAmount, 1, 'COMMA') + '원'}">상품 금액</p>
              <div class="data-row" th:each="option : ${item.options}">
                <span class="data-row__label" th:text="${option.groupName}">옵션</span>
                <span th:text="${option.optionName}">선택값</span>
              </div>
            </article>
          </section>
        </div>
        <aside><section><h2 class="section-title">주문 처리</h2><div class="panel stack">
          <p>현재 상태: <strong th:text="${order.statusLabel}">결제 대기</strong></p>
          <form th:if="${order.readyForPickup}" method="post"
                th:action="@{/admin/orders/{id}/pickup(id=${order.orderId})}">
            <button class="btn btn--primary" type="submit">픽업 완료 처리</button>
          </form>
        </div></section></aside>
      </div>
    </main>
  </div>
</div>
</body>
</html>
