<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 관리 | 관리자</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{fragments/admin/sidebar :: sidebar('orders')}"></aside>
  <div class="admin-main">
    <header th:replace="~{fragments/admin/header :: header('주문 관리')}"></header>
    <main class="admin-content">
      <h1 class="admin-page-title">주문 목록</h1>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>주문번호</th><th>주문자</th><th>상품명</th><th>금액</th><th>상태</th><th>픽업 일시</th><th>관리</th></tr></thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(orders)}"><td colspan="7">주문이 없습니다.</td></tr>
          <tr th:each="order : ${orders}">
            <td th:text="${order.orderNumber}">ORD-001</td>
            <td th:text="${order.ordererName}">주문자</td>
            <td th:text="${order.productName}">상품명</td>
            <td th:text="${#numbers.formatInteger(order.finalAmount, 1, 'COMMA') + '원'}">0원</td>
            <td><span class="badge" th:text="${order.statusLabel}">결제 대기</span></td>
            <td th:text="${#temporals.format(order.pickupAt, 'yyyy.MM.dd HH:mm')}">2026.08.03</td>
            <td><a class="btn" th:href="@{/admin/orders/{id}(id=${order.orderId})}">상세</a></td>
          </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</body>
</html>
