<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통계 | 관리자</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/statistics.css}">
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{fragments/admin/sidebar :: sidebar('statistics')}"></aside>
  <div class="admin-main">
    <header th:replace="~{fragments/admin/header :: header('통계')}"></header>
    <main class="admin-content">
      <h1 class="admin-page-title">기간별 통계</h1>

      <div class="alert alert--info">
        통계는 집계가 완료된 어제까지 제공됩니다.
      </div>

      <form method="get" th:action="@{/admin/statistics}" th:object="${searchForm}">
        <div class="admin-toolbar">
          <label for="startDate">시작일</label>
          <input id="startDate" class="form-control" type="date"
                 th:field="*{startDate}" th:max="${latestSelectableDate}">
          <span>~</span>
          <label for="endDate">종료일</label>
          <input id="endDate" class="form-control" type="date"
                 th:field="*{endDate}" th:max="${latestSelectableDate}">
          <button class="btn btn--primary" type="submit">조회</button>
        </div>

        <div class="alert alert--error" th:if="${#fields.hasAnyErrors()}">
          <strong>조회 기간을 확인해 주세요.</strong>
          <ul>
            <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
          </ul>
        </div>
      </form>

      <th:block th:if="${statistics != null}">
        <div class="alert alert--info" th:if="${statistics.aggregationDelayed}">
          전날 집계가 아직 완료되지 않아
          <strong th:text="${#temporals.format(statistics.endDate, 'yyyy.MM.dd')}">2026.08.09</strong>
          까지의 통계를 표시합니다.
        </div>

        <section class="grid grid--4 section">
          <article class="metric-card">
            <p>총 주문 건수</p>
            <strong th:text="|${#numbers.formatInteger(statistics.totalOrderCount, 0, 'COMMA')}건|">0건</strong>
          </article>
          <article class="metric-card">
            <p>완료 주문 건수</p>
            <strong th:text="|${#numbers.formatInteger(statistics.completedOrderCount, 0, 'COMMA')}건|">0건</strong>
          </article>
          <article class="metric-card">
            <p>취소 주문 건수</p>
            <strong th:text="|${#numbers.formatInteger(statistics.canceledOrderCount, 0, 'COMMA')}건|">0건</strong>
          </article>
          <article class="metric-card">
            <p>총매출</p>
            <strong th:text="|${#numbers.formatInteger(statistics.totalSalesAmount, 0, 'COMMA')}원|">0원</strong>
          </article>
        </section>

        <section class="section">
          <div id="statistics-chart-data" hidden>
            <span th:each="daily : ${statistics.dailyStatistics}"
                  data-statistics-point
                  th:attr="data-axis-label=${#temporals.format(daily.date, 'yyyy.MM.dd')},
                           data-order-count=${daily.orderCount},
                           data-sales-amount=${daily.salesAmount}"></span>
          </div>
          <div class="grid grid--2 statistics-chart-grid">
            <section>
              <h2 class="section-title">일별 주문 추이</h2>
              <div class="statistics-chart">
                <canvas id="daily-order-chart" role="img" aria-label="일별 주문 건수 꺾은선그래프">
                  일별 주문 건수 추이
                </canvas>
              </div>
            </section>
            <section>
              <h2 class="section-title">일별 매출 추이</h2>
              <div class="statistics-chart">
                <canvas id="daily-sales-chart" role="img" aria-label="일별 매출 꺾은선그래프">
                  일별 매출 추이
                </canvas>
              </div>
            </section>
          </div>
        </section>
      </th:block>
    </main>
  </div>
</div>
<script th:src="@{/webjars/chart.js/4.5.1/dist/chart.umd.js}"></script>
<script th:src="@{/js/statistics-chart.js}"></script>
</body>
</html>
