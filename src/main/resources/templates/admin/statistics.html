<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통계 | 관리자</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{fragments/admin/sidebar :: sidebar('statistics')}"></aside>
  <div class="admin-main">
    <header th:replace="~{fragments/admin/header :: header('통계')}"></header>
    <main class="admin-content">
      <h1 class="admin-page-title">기간별 통계</h1>

      <form method="get" th:action="@{/admin/statistics}" th:object="${searchForm}">
        <div class="admin-toolbar">
          <label for="startDate">시작일</label>
          <input id="startDate" class="form-control" type="date" th:field="*{startDate}">
          <span>~</span>
          <label for="endDate">종료일</label>
          <input id="endDate" class="form-control" type="date" th:field="*{endDate}">
          <button class="btn btn--primary" type="submit">조회</button>
        </div>

        <div class="alert alert--error" th:if="${#fields.hasAnyErrors()}">
          <strong>조회 기간을 확인해 주세요.</strong>
          <ul>
            <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
          </ul>
        </div>
      </form>

      <th:block th:if="${statistics != null}">
        <section class="grid grid--4 section">
          <article class="metric-card">
            <p>총 주문 건수</p>
            <strong th:text="|${#numbers.formatInteger(statistics.totalOrderCount, 0, 'COMMA')}건|">0건</strong>
          </article>
          <article class="metric-card">
            <p>완료 주문 건수</p>
            <strong th:text="|${#numbers.formatInteger(statistics.completedOrderCount, 0, 'COMMA')}건|">0건</strong>
          </article>
          <article class="metric-card">
            <p>취소 주문 건수</p>
            <strong th:text="|${#numbers.formatInteger(statistics.canceledOrderCount, 0, 'COMMA')}건|">0건</strong>
          </article>
          <article class="metric-card">
            <p>총매출</p>
            <strong th:text="|${#numbers.formatInteger(statistics.totalSalesAmount, 0, 'COMMA')}원|">0원</strong>
          </article>
        </section>

        <section class="section">
          <h2 class="section-title">일별 주문 · 매출 추이</h2>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
              <tr>
                <th>날짜</th>
                <th>주문 건수</th>
                <th>매출</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="daily : ${statistics.dailyStatistics}">
                <td th:text="${#temporals.format(daily.date, 'yyyy.MM.dd')}">2026.08.10</td>
                <td th:text="|${#numbers.formatInteger(daily.orderCount, 0, 'COMMA')}건|">0건</td>
                <td th:text="|${#numbers.formatInteger(daily.salesAmount, 0, 'COMMA')}원|">0원</td>
              </tr>
              <tr th:if="${#lists.isEmpty(statistics.dailyStatistics)}">
                <td colspan="3" class="text-muted">조회 기간의 통계가 없습니다.</td>
              </tr>
              </tbody>
            </table>
          </div>
        </section>
      </th:block>
    </main>
  </div>
</div>
</body>
</html>
