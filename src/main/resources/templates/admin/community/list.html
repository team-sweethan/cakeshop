<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커뮤니티 관리 | 관리자</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{fragments/admin/sidebar :: sidebar('community')}"></aside>
  <div class="admin-main">
    <header th:replace="~{fragments/admin/header :: header('커뮤니티 관리')}"></header>
    <main class="admin-content">

      <div th:replace="~{fragments/common/alert :: alert}"></div>

      <h1 class="admin-page-title">커뮤니티 관리</h1>

      <div class="cluster section">
        <a class="btn"
           th:classappend="${selectedStatus == null} ? ' is-active'"
           th:href="@{/admin/community(sort=${selectedSort})}">상태 전체</a>

        <a class="btn"
           th:classappend="${selectedStatus?.name() == 'PUBLISHED'} ? ' is-active'"
           th:href="@{/admin/community(status='PUBLISHED', sort=${selectedSort})}">노출 중</a>

        <a class="btn"
           th:classappend="${selectedStatus?.name() == 'BLOCKED'} ? ' is-active'"
           th:href="@{/admin/community(status='BLOCKED', sort=${selectedSort})}">차단됨</a>

        <a class="btn"
           th:classappend="${selectedStatus?.name() == 'DELETED'} ? ' is-active'"
           th:href="@{/admin/community(status='DELETED', sort=${selectedSort})}">삭제됨</a>
      </div>

      <div class="cluster section">
        <a class="btn"
           th:classappend="${selectedSort.name() == 'LATEST'} ? ' is-active'"
           th:href="@{/admin/community(status=${selectedStatus}, sort='LATEST')}">최신순</a>

        <a class="btn"
           th:classappend="${selectedSort.name() == 'REPORTS'} ? ' is-active'"
           th:href="@{/admin/community(status=${selectedStatus}, sort='REPORTS')}">신고 많은 순</a>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>번호</th><th>분류</th><th>제목</th><th>작성자</th><th>작성일</th><th>미처리 신고</th><th>상태</th><th>관리</th></tr>
          </thead>
          <tbody>
            <tr th:each="post : ${pageResult.content}">
              <td th:text="${post.id}">0</td>
              <td th:text="${post.categoryName}">분류</td>
              <td>
                <a th:href="@{/admin/community/{postId}(postId=${post.id})}"
                   th:text="${post.title}">제목</a>
              </td>
              <td th:text="${post.authorName()}">작성자</td>
              <td th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">2026.01.01</td>
              <td>
                <span th:if="${post.hasPendingReports()}" class="badge badge--danger"
                      th:text="${post.pendingReportCount}">0</span>
                <span th:unless="${post.hasPendingReports()}" class="text-muted">-</span>
              </td>
              <td>
                <span th:if="${post.status.name() == 'PUBLISHED'}"
                      class="badge badge--success">노출 중</span>
                <span th:if="${post.status.name() == 'BLOCKED'}"
                      class="badge badge--danger">차단됨</span>
                <span th:if="${post.status.name() == 'DELETED'}"
                      class="badge">삭제됨</span>
              </td>
              <td>
                <a class="btn" th:href="@{/admin/community/{postId}(postId=${post.id})}">상세보기</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="panel panel--dashed text-muted"
           th:if="${pageResult.content.isEmpty()}"
           style="text-align:center">
        조건에 맞는 게시글이 없습니다.
      </div>

      <nav th:if="${pageResult.totalPages > 1}"
           class="cluster section"
           aria-label="페이지 이동"
           style="justify-content:center">

        <a class="btn"
           th:if="${pageNavigation.hasPreviousBlock}"
           th:href="@{/admin/community(
               status=${selectedStatus},
               sort=${selectedSort},
               page=${pageNavigation.previousPage}
           )}">
          이전
        </a>

        <span class="btn btn--disabled" th:unless="${pageNavigation.hasPreviousBlock}">이전</span>

        <a class="btn"
           th:each="pageNumber :
               ${#numbers.sequence(pageNavigation.startPage, pageNavigation.endPage)}"
           th:text="${pageNumber}"
           th:classappend="${pageNumber == pageResult.page} ? ' is-active'"
           th:href="@{/admin/community(
               status=${selectedStatus},
               sort=${selectedSort},
               page=${pageNumber}
           )}">
          1
        </a>

        <a class="btn"
           th:if="${pageNavigation.hasNextBlock}"
           th:href="@{/admin/community(
               status=${selectedStatus},
               sort=${selectedSort},
               page=${pageNavigation.nextPage}
           )}">
          다음
        </a>

        <span class="btn btn--disabled" th:unless="${pageNavigation.hasNextBlock}">다음</span>
      </nav>

      <p class="note">차단된 게시글은 고객 화면에서 열람이 차단됩니다.</p>
    </main>
  </div>
</div>
</body>
</html>
