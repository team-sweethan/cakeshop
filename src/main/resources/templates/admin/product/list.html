<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>상품 관리 | 관리자</title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body>
<div class="admin-layout">

    <!-- 관리자 사이드바 -->
    <aside th:replace=
                   "~{fragments/admin/sidebar :: sidebar('products')}">
    </aside>

    <div class="admin-main">

        <!-- 관리자 헤더 -->
        <header th:replace=
                        "~{fragments/admin/header :: header('상품 관리')}">
        </header>

        <main class="admin-content">

            <h1 class="admin-page-title">
                상품 목록
            </h1>

            <!-- 검색 영역 -->
            <!-- 검색 기능은 다음 단계에서 구현한다. -->
            <div class="admin-toolbar">

                <form class="filter-form"
                      method="get"
                      th:action="@{/admin/products}">

                    <input class="form-control"
                           type="text"
                           name="keyword"
                           placeholder="상품명 검색">

                    <select class="form-control"
                            name="type">
                        <option value="">
                            유형 전체
                        </option>
                        <option value="GENERAL">
                            일반 케이크
                        </option>
                        <option value="CUSTOM">
                            주문 제작
                        </option>
                    </select>

                    <select class="form-control"
                            name="status">
                        <option value="">
                            판매 상태 전체
                        </option>
                        <option value="ACTIVE">
                            판매 중
                        </option>
                        <option value="INACTIVE">
                            판매 중지
                        </option>
                    </select>

                    <select class="form-control"
                            name="stock">
                        <option value="">
                            재고 전체
                        </option>
                        <option value="AVAILABLE">
                            재고 있음
                        </option>
                        <option value="OUT_OF_STOCK">
                            품절
                        </option>
                    </select>

                    <button class="btn"
                            type="submit">
                        검색
                    </button>
                </form>

                <a class="btn btn--primary"
                   th:href="@{/admin/products/new}">
                    상품 등록
                </a>
            </div>

            <!-- 전체 상품 개수 -->
            <p class="text-muted">
                총
                <strong th:text="${pageResult.totalElements}">
                    0
                </strong>개 상품
            </p>

            <!-- 상품 목록 테이블 -->
            <div class="table-wrap">
                <table class="data-table">

                    <thead>
                    <tr>
                        <th>이미지</th>
                        <th>상품명</th>
                        <th>유형</th>
                        <th>가격</th>
                        <th>재고</th>
                        <th>판매 상태</th>
                        <th>등록일</th>
                        <th>관리</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- 조회된 상품 목록 -->
                    <tr th:each="product : ${pageResult.content}">

                        <!-- 이미지 기능 구현 전까지 자리 표시자를 출력한다. -->
                        <td>
                            <div class=
                                         "placeholder-image placeholder-image--sm">
                                이미지
                            </div>
                        </td>

                        <!-- 상품명 -->
                        <td th:text="${product.name}">
                            상품명
                        </td>

                        <!-- 상품 유형 -->
                        <td th:text=
                                    "${product.productType.displayName}">
                            상품 유형
                        </td>

                        <!-- 상품 가격 -->
                        <td th:text=
                                    "|${#numbers.formatInteger(
                        product.basePrice,
                        0,
                        'COMMA'
                    )}원|">
                            0원
                        </td>

                        <!-- 재고 -->
                        <td>
                            <!-- 재고 제한 없음 -->
                            <span th:if="${product.unlimitedStock}">
                -
              </span>

                            <!-- 재고 수량이 존재하는 상품 -->
                            <span th:unless="${product.unlimitedStock}"
                                  th:text="|${product.stockQuantity}개|">
                0개
              </span>

                            <!-- 품절 표시 -->
                            <span class="badge badge--danger"
                                  th:if="${product.outOfStock}">
                품절
              </span>
                        </td>

                        <!-- 판매 상태 -->
                        <td>
              <span class="badge badge--success"
                    th:if=
                            "${product.status.name() == 'ACTIVE'}">
                판매 중
              </span>

                            <span class="badge badge--danger"
                                  th:if=
                                          "${product.status.name() == 'INACTIVE'}">
                판매 중지
              </span>
                        </td>

                        <!-- 등록일 -->
                        <td th:text=
                                    "${#temporals.format(
                        product.createdAt,
                        'yyyy.MM.dd'
                    )}">
                            2026.01.01
                        </td>

                        <!-- 관리 메뉴 -->
                        <td>
                            <div class="cluster">
                                <a class="btn"
                                   th:href=
                                           "@{/admin/products/{productId}/edit(
                           productId=${product.id}
                       )}">
                                    수정
                                </a>
                            </div>
                        </td>
                    </tr>

                    <!-- 등록된 상품이 없는 경우 -->
                    <tr th:if="${pageResult.content.isEmpty()}">
                        <td colspan="8"
                            class="text-muted"
                            style="text-align: center;">
                            등록된 상품이 없습니다.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

            <!-- 페이지 이동 -->
            <nav class="cluster"
                 th:if="${pageResult.totalPages > 1}"
                 aria-label="페이지 이동"
                 style=
                         "justify-content: center; margin-top: 16px;">

                <!-- 이전 페이지 -->
                <a class="btn"
                   th:if="${pageResult.page > 1}"
                   th:href=
                           "@{/admin/products(
                   page=${pageResult.page - 1},
                   size=${pageResult.size}
               )}">
                    이전
                </a>

                <span class="btn btn--disabled"
                      th:unless="${pageResult.page > 1}">
          이전
        </span>

                <!-- 페이지 번호 -->
                <a class="btn"
                   th:each="pageNumber :
               ${#numbers.sequence(
                   1,
                   pageResult.totalPages
               )}"
                   th:text="${pageNumber}"
                   th:classappend=
                           "${pageNumber == pageResult.page}
                   ? ' is-active'"
                   th:href=
                           "@{/admin/products(
                   page=${pageNumber},
                   size=${pageResult.size}
               )}">
                    1
                </a>

                <!-- 다음 페이지 -->
                <a class="btn"
                   th:if=
                           "${pageResult.page
                   < pageResult.totalPages}"
                   th:href=
                           "@{/admin/products(
                   page=${pageResult.page + 1},
                   size=${pageResult.size}
               )}">
                    다음
                </a>

                <span class="btn btn--disabled"
                      th:unless=
                              "${pageResult.page
                      < pageResult.totalPages}">
          다음
        </span>
            </nav>

        </main>
    </div>
</div>
</body>
</html>
