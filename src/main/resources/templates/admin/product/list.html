<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>상품 관리 | 관리자</title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body>
<div class="admin-layout">

    <aside th:replace=
                   "~{fragments/admin/sidebar :: sidebar('products')}">
    </aside>

    <div class="admin-main">

        <header th:replace=
                        "~{fragments/admin/header :: header('상품 관리')}">
        </header>

        <main class="admin-content">

            <h1 class="admin-page-title">
                상품 목록
            </h1>

            <!-- 상품 검색 및 필터 -->
            <div class="admin-toolbar">

                <form class="filter-form"
                      method="get"
                      th:action="@{/admin/products}"
                      th:object="${condition}">

                    <!-- 검색 후에도 페이지 크기를 유지한다. -->
                    <input type="hidden"
                           name="size"
                           th:value="${pageResult.size}">

                    <!-- 상품명 검색 -->
                    <input class="form-control"
                           type="text"
                           th:field="*{keyword}"
                           placeholder="상품명 검색">

                    <!-- 상품 유형 필터 -->
                    <select class="form-control"
                            th:field="*{type}">
                        <option value="">
                            유형 전체
                        </option>

                        <option th:each="productType : ${productTypes}"
                                th:value="${productType}"
                                th:text="${productType.displayName}">
                            상품 유형
                        </option>
                    </select>

                    <!-- 판매 상태 필터 -->
                    <select class="form-control"
                            th:field="*{status}">
                        <option value="">
                            판매 상태 전체
                        </option>

                        <option th:each=
                                        "productStatus : ${productStatuses}"
                                th:value="${productStatus}"
                                th:text=
                                        "${productStatus.name() == 'ACTIVE'
                            ? '판매 중'
                            : '판매 중지'}">
                            판매 상태
                        </option>
                    </select>

                    <!-- 재고 상태 필터 -->
                    <select class="form-control"
                            th:field="*{stock}">
                        <option value="">
                            재고 전체
                        </option>

                        <option th:each=
                                        "stockFilter : ${stockFilters}"
                                th:value="${stockFilter}"
                                th:text="${stockFilter.displayName}">
                            재고 상태
                        </option>
                    </select>

                    <button class="btn"
                            type="submit">
                        검색
                    </button>

                    <!-- 검색 조건 초기화 -->
                    <a class="btn"
                       th:href="@{/admin/products(
                 size=${pageResult.size}
             )}">
                        초기화
                    </a>
                </form>

                <a class="btn btn--primary"
                   th:href="@{/admin/products/new}">
                    상품 등록
                </a>
            </div>

            <!-- 검색 결과 개수 -->
            <p class="text-muted">
                총
                <strong th:text="${pageResult.totalElements}">
                    0
                </strong>개 상품
            </p>

            <!-- 상품 목록 -->
            <div class="table-wrap">
                <table class="data-table">

                    <thead>
                    <tr>
                        <th>이미지</th>
                        <th>상품명</th>
                        <th>유형</th>
                        <th>가격</th>
                        <th>재고</th>
                        <th>판매 상태</th>
                        <th>등록일</th>
                        <th>관리</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- 검색 조건에 맞는 상품 -->
                    <tr th:each="product : ${pageResult.content}">

                        <td>
                            <div class=
                                         "placeholder-image placeholder-image--sm">
                                이미지
                            </div>
                        </td>

                        <td th:text="${product.name}">
                            상품명
                        </td>

                        <td th:text="${product.productType.displayName}">
                            상품 유형
                        </td>

                        <td th:text=
                                    "|${#numbers.formatInteger(
                        product.basePrice,
                        0,
                        'COMMA'
                    )}원|">
                            0원
                        </td>

                        <td>
                            <!-- 재고 제한 없음 -->
                            <span th:if="${product.unlimitedStock}">
                -
              </span>

                            <!-- 재고 수량 -->
                            <span th:unless="${product.unlimitedStock}"
                                  th:text="|${product.stockQuantity}개|">
                0개
              </span>

                            <!-- 품절 표시 -->
                            <span class="badge badge--danger"
                                  th:if="${product.outOfStock}">
                품절
              </span>
                        </td>

                        <td>
              <span class="badge badge--success"
                    th:if=
                            "${product.status.name() == 'ACTIVE'}">
                판매 중
              </span>

                            <span class="badge badge--danger"
                                  th:if=
                                          "${product.status.name() == 'INACTIVE'}">
                판매 중지
              </span>
                        </td>

                        <td th:text=
                                    "${#temporals.format(
                        product.createdAt,
                        'yyyy.MM.dd'
                    )}">
                            등록일
                        </td>

                        <td>
                            <a class="btn"
                               th:href=
                                       "@{/admin/products/{productId}/edit(
                         productId=${product.id}
                     )}">
                                수정
                            </a>
                        </td>
                    </tr>

                    <!-- 검색 결과가 없는 경우 -->
                    <tr th:if="${pageResult.content.isEmpty()}">
                        <td colspan="8"
                            class="text-muted"
                            style="text-align: center;">
                            검색 조건에 맞는 상품이 없습니다.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

            <!-- 페이지 이동 -->
            <nav class="cluster"
                 th:if="${pageResult.totalPages > 1}"
                 aria-label="페이지 이동"
                 style=
                         "justify-content: center; margin-top: 16px;">

                <!-- 이전 페이지 -->
                <a class="btn"
                   th:if="${pageResult.page > 1}"
                   th:href=
                           "@{/admin/products(
                    keyword=${condition.keyword},
                    type=${condition.type},
                    status=${condition.status},
                    stock=${condition.stock},
                    page=${pageResult.page - 1},
                    size=${pageResult.size}
                )}">
                    이전
                </a>

                <span class="btn btn--disabled"
                      th:unless="${pageResult.page > 1}">
          이전
        </span>

                <!-- 페이지 번호 -->
                <a class="btn"
                   th:each="pageNumber :
                ${#numbers.sequence(
                    1,
                    pageResult.totalPages
                )}"
                   th:text="${pageNumber}"
                   th:classappend=
                           "${pageNumber == pageResult.page}
                    ? ' is-active'"
                   th:href=
                           "@{/admin/products(
                    keyword=${condition.keyword},
                    type=${condition.type},
                    status=${condition.status},
                    stock=${condition.stock},
                    page=${pageNumber},
                    size=${pageResult.size}
                )}">
                    1
                </a>

                <!-- 다음 페이지 -->
                <a class="btn"
                   th:if=
                           "${pageResult.page
                    < pageResult.totalPages}"
                   th:href=
                           "@{/admin/products(
                    keyword=${condition.keyword},
                    type=${condition.type},
                    status=${condition.status},
                    stock=${condition.stock},
                    page=${pageResult.page + 1},
                    size=${pageResult.size}
                )}">
                    다음
                </a>

                <span class="btn btn--disabled"
                      th:unless=
                              "${pageResult.page
                      < pageResult.totalPages}">
          다음
        </span>
            </nav>

        </main>
    </div>
</div>
</body>
</html>
