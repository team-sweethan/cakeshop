<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="알림">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--narrow">
    <div th:replace="~{fragments/customer/mock-notice :: notice}"></div>
    <div class="cluster cluster--between">
      <h1>알림</h1>
      <button class="btn" type="button" data-read-all>전체 읽음</button>
    </div>
    <div class="stack">
      <!-- DB 동적 알림 목록 -->
      <th:block th:if="${notifications != null and !#lists.isEmpty(notifications)}">
        <article th:each="item : ${notifications}" 
                 class="notification-item" 
                 th:classappend="${!item.isRead} ? ' is-unread'"
                 th:data-id="${item.id}">
          <div class="cluster" style="align-items:flex-start">
            <span th:if="${!item.isRead}" class="notification-dot" aria-hidden="true"></span>
            <div>
              <span class="badge" th:text="${item.title}">알림</span>
              <p th:text="${item.content}">알림 내용입니다.</p>
              <time class="text-muted" th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}">시간</time>
            </div>
          </div>
          <a class="btn" th:if="${item.targetUrl != null}" th:href="@{${item.targetUrl}}">상세</a>
        </article>
      </th:block>

      <!-- DB 데이터가 없는 경우 정적 예시 목업 목록 -->
      <th:block th:if="${notifications == null or #lists.isEmpty(notifications)}">
        <p class="text-muted text-center" style="padding: 2rem 0;">등록된 알림이 없습니다.</p>
      </th:block>
    </div>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
