<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="마이페이지">
<header th:replace="~{fragments/common/header :: header}"></header>
<main class="page-container ">
  <div th:replace="~{fragments/customer/mock-notice :: notice}"></div>
  <h1>마이페이지</h1>
  <div class="layout-sidebar">
    <aside class="panel">
      <strong th:text="${member.nickname}"></strong>
      <p class="text-muted" th:text="${member.email}"></p>
      <nav class="stack" style="margin-top:12px">
        <span class="btn btn--block btn--disabled" aria-disabled="true">주문 내역 연동 준비 중</span>
        <a class="btn btn--block" th:href="@{/chat}">1:1 문의</a>
        <a class="btn btn--block" href="/mypage/coupons">보유 쿠폰</a>
        <a class="btn btn--block" href="/reviews/new">작성할 후기</a>
        <a class="btn btn--block" href="/mypage/profile">회원정보 수정</a>
      </nav>
    </aside>
    <div>
      <section class="section">
        <h2 class="section-title">회원 정보</h2>
        <div class="panel">
          <div class="data-row">
            <span class="data-row__label">이름</span>
            <span th:text="${member.name}"></span>
          </div>
          <div class="data-row">
            <span class="data-row__label">이메일</span>
            <span th:text="${member.email}"></span>
          </div>
          <div class="data-row">
            <span class="data-row__label">전화번호</span>
            <span th:text="${member.phone}"></span>
          </div>
          <div class="data-row">
            <span class="data-row__label">닉네임</span>
            <span th:text="${member.nickname}"></span>
          </div>
          <div class="data-row">
            <span class="data-row__label">생년월일</span>
            <span th:text="${member.birthDate != null
                    ? #temporals.format(member.birthDate, 'yyyy-MM-dd')
                    : '미등록'}"></span>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">주문 내역</h2>
        <div class="panel panel--dashed text-muted">
          주문 도메인 연동 후 진행 중인 주문과 최근 주문을 표시합니다.
        </div>
      </section>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
