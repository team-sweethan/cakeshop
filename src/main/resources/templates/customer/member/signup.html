<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="회원가입">
<header th:replace="~{fragments/common/header :: header}"></header>

<main class="page-container page-container--form">
  <div th:replace="~{fragments/customer/mock-notice :: notice}"></div>
  <h1>회원가입</h1>

  <!-- 1. th:object와 th:action을 사용하여 폼과 DTO 연결 -->
  <form class="panel" th:action="@{/join}" th:object="${signupForm}" method="post">

    <section class="section">
      <h2 class="section-title">약관 동의</h2>
      <div class="panel stack terms-panel">
        <label class="choice"><input type="checkbox" required> [필수] 이용약관 동의</label>
        <label class="choice"><input type="checkbox" required> [필수] 개인정보 처리방침 동의</label>
        <label class="choice"><input type="checkbox"> [선택] 마케팅 정보 수신 동의</label>
        <hr class="divider">
        <label class="choice"><input type="checkbox" data-check-all> 전체 동의</label>
      </div>
    </section>

    <!-- 에러 메시지 출력 영역 -->
    <div th:if="${msg}" class="error-box" style="color: red; margin-bottom: 15px; font-weight: bold;" th:text="${msg}"></div>

    <div class="form-group">
      <label class="form-label" for="signup-email">이메일 <span class="required">*</span></label>
      <div class="cluster">
        <!-- 2. th:field="*{email}"을 사용하여 DTO 필드와 매핑 -->
        <input class="form-control" th:field="*{email}" id="signup-email" type="email"
               pattern="^[A-Za-z0-9.!#$%&amp;'*+/=?^_`{|}~-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$"
               placeholder="example@email.com" style="flex:1" required>
        <button class="btn" type="button" onclick="checkEmail()">중복 확인</button>
      </div>
      <p class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
      <p class="form-error" id="email-format-message" aria-live="polite"></p>
      <p class="form-help" id="email-result-msg" aria-live="polite"></p>
    </div>

    <div class="form-group">
      <label class="form-label" for="signup-password">비밀번호 <span class="required">*</span></label>
      <input class="form-control" th:field="*{password}" id="signup-password" type="password"
             minlength="8" maxlength="100" placeholder="비밀번호 입력" required>
      <p class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
      <p class="form-help">8~100자, 영문·숫자·특수문자를 각각 포함하고 공백 없이 입력해 주세요.</p>
    </div>

    <div class="form-group">
      <label class="form-label" for="signup-password-confirm">비밀번호 확인 <span class="required">*</span></label>
      <input class="form-control" th:field="*{passwordConfirm}" id="signup-password-confirm" type="password" required>
      <p class="form-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>
      <p class="form-error" th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}"></p>
      <p class="form-help" id="password-match-message" aria-live="polite"></p>
    </div>

    <div class="form-group">
      <label class="form-label" for="signup-name">이름 <span class="required">*</span></label>
      <input class="form-control" th:field="*{name}" id="signup-name" placeholder="실명 입력" required>
      <p class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
    </div>

    <div class="form-group">
      <label class="form-label" for="signup-phone">전화번호 <span class="required">*</span></label>
      <input class="form-control" th:field="*{phone}" id="signup-phone" type="tel" placeholder="010-0000-0000" maxlength="13" required>
      <p class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
    </div>

    <div class="form-group">
      <label class="form-label" for="signup-nickname">닉네임 <span class="required">*</span></label>
      <input class="form-control" th:field="*{nickname}" id="signup-nickname" placeholder="닉네임 입력" required>
      <p class="form-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
    </div>

    <button class="btn btn--primary btn--block" type="submit">가입하기</button>
  </form>
</main>

<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>

<!-- 3. 이메일 중복 확인 스크립트 -->
<script>
  const emailInput = document.getElementById('signup-email');
  const emailFormatMessage = document.getElementById('email-format-message');
  const emailResultMessage = document.getElementById('email-result-msg');
  const emailPattern = /^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+$/;
  let emailFormatTouched = false;

  function updateEmailFormatMessage() {
    const email = emailInput.value.trim();
    const valid = emailPattern.test(email);

    emailFormatMessage.innerText = email && !valid
            ? "이메일 형식을 확인해 주세요."
            : "";
    return valid;
  }

  emailInput.addEventListener('blur', () => {
    emailFormatTouched = true;
    updateEmailFormatMessage();
  });

  emailInput.addEventListener('input', () => {
    emailResultMessage.innerText = "";
    emailResultMessage.className = "form-help";
    if (emailFormatTouched) {
      updateEmailFormatMessage();
    }
  });

  function checkEmail() {
    const email = emailInput.value.trim();
    emailFormatTouched = true;
    if (!updateEmailFormatMessage()) {
      emailResultMessage.innerText = "";
      emailInput.focus();
      return;
    }

    fetch('/emailCheck?email=' + encodeURIComponent(email))
            .then(response => response.json())
            .then(data => {
              if (!data.valid) {
                emailFormatMessage.innerText = data.message;
                emailResultMessage.innerText = "";
                return;
              }

              emailFormatMessage.innerText = "";
              emailResultMessage.innerText = data.message;
              emailResultMessage.className = data.available
                      ? "form-success"
                      : "form-error";
            })
            .catch(error => {
              console.error('Error:', error);
              alert("중복 확인 중 오류가 발생했습니다.");
            });
  }
</script>
<script>
  const passwordInput = document.getElementById('signup-password');
  const passwordConfirmInput = document.getElementById('signup-password-confirm');
  const passwordMatchMessage = document.getElementById('password-match-message');

  function updatePasswordMatchMessage() {
    if (!passwordConfirmInput.value) {
      passwordMatchMessage.innerText = "";
      passwordMatchMessage.className = "form-help";
      return;
    }

    const matches = passwordInput.value === passwordConfirmInput.value;
    passwordMatchMessage.innerText = matches
            ? "비밀번호가 일치합니다."
            : "비밀번호가 일치하지 않습니다.";
    passwordMatchMessage.className = matches ? "form-success" : "form-error";
  }

  passwordInput.addEventListener('input', updatePasswordMatchMessage);
  passwordConfirmInput.addEventListener('input', updatePasswordMatchMessage);
</script>
<script>
  function formatPhoneNumber(value) {
    const digits = value.replace(/\D/g, '').slice(0, 11);

    if (digits.length <= 3) {
      return digits;
    }
    if (digits.length <= 7) {
      return `${digits.slice(0, 3)}-${digits.slice(3)}`;
    }
    if (digits.startsWith('010') || digits.length === 11) {
      return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
    }
    return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
  }

  const phoneInput = document.getElementById('signup-phone');
  phoneInput.addEventListener('input', (event) => {
    event.target.value = formatPhoneNumber(event.target.value);
  });
</script>
</body>
</html>
