<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 찾기 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
  <script defer th:src="@{/js/member-birth-date.js}"></script>
</head>
<body>
<header th:replace="~{fragments/common/header :: header}"></header>
<th:block th:replace="~{fragments/common/alert :: popup}"></th:block>
<main class="page-container page-container--narrow">
  <section class="panel auth-card section">
    <h1>비밀번호 찾기</h1>
    <p class="note">개발 환경용 간편 본인 확인 기능입니다.</p>
    <p class="form-help">회원가입 시 입력한 정보를 모두 입력해 주세요.</p>

    <form class="form-stack" th:action="@{/find-password/verify}"
          th:object="${passwordRecoveryForm}" method="post">
      <p class="alert alert--error" th:if="${#fields.hasGlobalErrors()}"
         th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>

      <div class="form-group">
        <label class="form-label" for="recovery-email">이메일</label>
        <input class="form-control" id="recovery-email" th:field="*{email}"
               type="email" maxlength="255" required autofocus>
        <p class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="recovery-name">이름</label>
        <input class="form-control" id="recovery-name" th:field="*{name}" maxlength="50" required>
        <p class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="password-recovery-birth-date">생년월일</label>
        <div data-birth-date-picker>
          <input class="form-control" id="password-recovery-birth-date" type="date"
                 th:field="*{birthDate}" data-birth-date-value required>
          <div class="birth-date-selects">
          <select class="form-control" id="password-recovery-birth-year" aria-label="태어난 연도"
                  data-birth-year required>
            <option value="">연도</option>
          </select>
          <select class="form-control" aria-label="태어난 달" data-birth-month required>
            <option value="">월</option>
          </select>
          <select class="form-control" aria-label="태어난 일" data-birth-day required>
            <option value="">일</option>
          </select>
          </div>
        </div>
        <p class="form-error" th:if="${#fields.hasErrors('birthDate')}"
           th:errors="*{birthDate}"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="recovery-phone">전화번호</label>
        <input class="form-control" id="recovery-phone" th:field="*{phone}" type="tel"
               placeholder="010-0000-0000" maxlength="13" required>
        <p class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
      </div>

      <button class="btn btn--primary btn--block" type="submit">회원정보 확인</button>
    </form>

    <div class="cluster">
      <a class="btn" th:href="@{/login}">로그인으로 돌아가기</a>
    </div>
  </section>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
