<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 찾기 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/password-recovery.js}"></script>
</head>
<body>
<header th:replace="~{fragments/common/header :: header}"></header>
<th:block th:replace="~{fragments/common/alert :: popup}"></th:block>
<main class="page-container page-container--narrow">
  <section class="panel auth-card section">
    <h1>비밀번호 찾기</h1>
    <p class="note">가입한 이메일로 받은 인증번호를 확인한 뒤 비밀번호를 재설정합니다.</p>

    <form class="form-stack" id="password-recovery-form"
          th:action="@{/email-verifications/password-reset/send}" method="post">
      <div class="form-group">
        <label class="form-label" for="recovery-email">이메일</label>
        <div class="cluster">
          <input class="form-control" id="recovery-email" name="email"
                 type="email" maxlength="255" required autofocus>
          <button class="btn btn--primary" id="recovery-code-send-button" type="submit">
            인증번호 발송
          </button>
        </div>
        <p class="form-help" id="recovery-email-message"></p>
      </div>

      <div class="form-group" id="recovery-code-group" hidden>
        <label class="form-label" for="recovery-code">인증번호</label>
        <div class="cluster">
          <input class="form-control" id="recovery-code" type="text"
                 inputmode="numeric" autocomplete="one-time-code"
                 minlength="6" maxlength="6" pattern="\d{6}">
          <button class="btn btn--primary" id="recovery-code-verify-button" type="button">
            인증 확인
          </button>
        </div>
        <p class="form-help" id="recovery-code-message"></p>
      </div>
    </form>

    <div class="cluster">
      <a class="btn" th:href="@{/login}">로그인으로 돌아가기</a>
    </div>
  </section>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
