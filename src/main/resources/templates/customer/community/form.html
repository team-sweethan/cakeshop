<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${editingPostId} != null ? '글 수정 | 케이크 쇼핑몰' : '글쓰기 | 케이크 쇼핑몰'">글쓰기 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body th:attr="data-page-title=${editingPostId} != null ? '글 수정' : '글쓰기'">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--form">

    <h1 th:text="${editingPostId} != null ? '글 수정' : '글쓰기'">글쓰기</h1>

    <!--
      작성과 수정이 같은 폼을 쓴다. 수정 항목이 작성 항목과 같아서(DOMAIN.md 6.3)
      마크업을 두 벌로 두면 한쪽만 고치는 일이 생긴다.
    -->
    <form method="post"
          th:object="${form}"
          th:action="${editingPostId} != null
                     ? @{/community/{postId}/edit(postId=${editingPostId})}
                     : @{/community}">
      <div class="form-group">
        <label class="form-label" for="categoryId">분류 <span class="required">*</span></label>
        <!--
          선택지는 목록 필터와 같은 활성 카테고리다(DOMAIN.md 6.8).
          화면에 직접 적어 두면 비활성 카테고리가 선택지에 남는다.
        -->
        <select class="form-control" id="categoryId" th:field="*{categoryId}" required>
          <option value="">선택하세요</option>
          <option th:each="category : ${categories}"
                  th:value="${category.id}"
                  th:text="${category.name}">분류</option>
        </select>
        <p class="field-error" th:errors="*{categoryId}"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="title">제목 <span class="required">*</span></label>
        <input class="form-control" id="title" type="text" th:field="*{title}"
               placeholder="제목을 입력하세요" maxlength="100" required>
        <p class="field-error" th:errors="*{title}"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="content">내용 <span class="required">*</span></label>
        <!--
          maxlength는 서버 검증(DOMAIN.md 7)과 같은 5000자다. 화면 제한이 없으면
          긴 글을 다 쓰고 나서 거절당한다.
        -->
        <textarea class="form-control form-control--textarea" id="content" th:field="*{content}"
                  style="min-height:220px" placeholder="내용을 입력하세요"
                  maxlength="5000" required></textarea>
        <p class="field-error" th:errors="*{content}"></p>
      </div>

      <div class="cluster cluster--between section">
        <a class="btn" th:href="${editingPostId} != null
                                ? @{/community/{postId}(postId=${editingPostId})}
                                : @{/community}">취소</a>
        <button class="btn btn--primary" type="submit"
                th:text="${editingPostId} != null ? '수정' : '등록'">등록</button>
      </div>
    </form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
