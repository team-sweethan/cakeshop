<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="게시글 상세">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--narrow">

    <div class="cluster cluster--between">
      <a class="btn" th:href="@{/community}">← 목록</a>

      <div class="cluster" sec:authorize="!hasRole('ADMIN')" th:if="${canEdit}">
        <a class="btn" th:href="@{/community/{postId}/edit(postId=${post.id})}">수정</a>
        <form method="post" th:action="@{/community/{postId}/delete(postId=${post.id})}"
              onsubmit="return confirm('게시글을 삭제할까요? 되돌릴 수 없습니다.');">
          <button class="btn btn--danger" type="submit">삭제</button>
        </form>
      </div>
    </div>

    <div th:replace="~{fragments/common/alert :: alert}"></div>

    <div class="panel" th:if="${post.blocked}">
      <strong>관리자가 차단한 게시글입니다.</strong>
      <p class="text-muted" th:text="${post.blockedReason}">차단 사유</p>
      <p class="note">이 글은 다른 회원에게 보이지 않습니다.</p>
    </div>

    <article class="section">
      <span class="badge badge--info" th:text="${post.categoryName}">카테고리</span>
      <h1 th:text="${post.title}">제목</h1>
      <p class="text-muted">
        <span th:text="${post.authorName()}">작성자</span> ·
        <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">2026.01.01</span> ·
        <span th:text="'조회 ' + ${post.viewCount}">조회 0</span>
        <span th:if="${post.edited}" class="note">(수정됨)</span>
      </p>
      <hr class="divider">

      <div class="stack">
        <p th:text="${post.content}" style="white-space:pre-wrap">본문</p>
      </div>

      <!--/* 첨부는 본문 아래 목록으로 붙는다(specs/community-post.md A4). */-->
      <div class="stack section" th:if="${!#lists.isEmpty(postImages)}">
        <img th:each="image : ${postImages}"
             th:src="@{${image.imageUrl}}"
             alt="첨부 이미지"
             style="max-width:100%">
      </div>

      <div class="cluster section" sec:authorize="!hasRole('ADMIN')">
        <span class="text-muted" th:text="'좋아요 ' + ${post.likeCount}">좋아요 0</span>

        <form method="post" th:if="${canLike and likedByViewer}"
              th:action="@{/community/{postId}/likes/delete(postId=${post.id})}">
          <input type="hidden" name="comments" th:value="${commentSection.limit}">
          <button class="btn" type="submit">좋아요 취소</button>
        </form>

        <form method="post" th:if="${canLike and !likedByViewer}"
              th:action="@{/community/{postId}/likes(postId=${post.id})}">
          <input type="hidden" name="comments" th:value="${commentSection.limit}">
          <button class="btn btn--primary" type="submit">좋아요</button>
        </form>
      </div>

      <details class="section" sec:authorize="!hasRole('ADMIN')"
               th:if="${canReport and !alreadyReported}"
               th:object="${reportForm}"
               th:attr="open=${#fields.hasErrors('reason')} ? 'open' : null">
        <summary>이 게시글 신고</summary>

        <form method="post"
              th:action="@{/community/{postId}/reports(postId=${post.id})}">
          <input type="hidden" name="comments" th:value="${commentSection.limit}">
          <div class="form-group">
            <label class="form-label" for="reportReason">신고 사유</label>
            <textarea class="form-control form-control--textarea" id="reportReason"
                      th:field="*{reason}" style="min-height:96px"
                      placeholder="신고 사유를 입력하세요" maxlength="500" required></textarea>
            <p class="field-error" th:errors="*{reason}"></p>
          </div>
          <div class="cluster cluster--between">
            <span class="text-muted">접수된 신고는 취소할 수 없습니다.</span>
            <button class="btn btn--danger" type="submit">신고 접수</button>
          </div>
        </form>
      </details>

      <p class="note" sec:authorize="!hasRole('ADMIN')" th:if="${alreadyReported}">
        이미 신고한 게시글입니다.
      </p>
    </article>

    <hr class="divider">

    <section class="section">
      <h2 class="section-title"
          th:text="'댓글 ' + ${commentSection.publishedCount}">댓글 0</h2>

      <div class="cluster" th:if="${commentSection.canLoadMore()}">
        <a class="btn"
           th:href="@{/community/{postId}(
               postId=${post.id},
               comments=${commentSection.nextLimit()}
           )}">
          이전 댓글 더 보기
        </a>
        <span class="text-muted"
              th:text="'남은 댓글 ' + ${commentSection.hiddenCount()}">남은 댓글 0</span>
      </div>

      <p class="note" th:if="${commentSection.cappedByLimit()}">
        오래된 댓글 일부는 표시하지 않습니다.
      </p>

      <div class="stack">
        <article class="panel" th:each="comment : ${commentSection.comments}">

          <p class="text-muted" th:if="${comment.deleted}">삭제된 댓글입니다.</p>

          <div th:unless="${comment.deleted}">
            <div class="cluster cluster--between">
              <span class="text-muted">
                <span th:text="${comment.authorName()}">작성자</span> ·
                <span th:text="${#temporals.format(comment.createdAt, 'yyyy.MM.dd')}">2026.01.01</span>
              </span>

              <form method="post"
                    sec:authorize="!hasRole('ADMIN')"
                    th:if="${canComment and viewerId == comment.memberId}"
                    th:action="@{/community/{postId}/comments/{commentId}/delete(
                        postId=${post.id},
                        commentId=${comment.id}
                    )}"
                    onsubmit="return confirm('댓글을 삭제할까요? 되돌릴 수 없습니다.');">
                <input type="hidden" name="comments" th:value="${commentSection.limit}">
                <button class="btn btn--danger" type="submit">댓글 삭제</button>
              </form>
            </div>

            <p th:text="${comment.content}" style="white-space:pre-wrap">댓글 본문</p>
          </div>
        </article>

        <div class="panel panel--dashed text-muted"
             th:if="${commentSection.comments.isEmpty()}"
             style="text-align:center">
          아직 댓글이 없습니다.
        </div>
      </div>

      <form class="section" method="post"
            sec:authorize="!hasRole('ADMIN')"
            th:if="${canComment}"
            th:object="${commentForm}"
            th:action="@{/community/{postId}/comments(postId=${post.id})}">
        <input type="hidden" name="comments" th:value="${commentSection.limit}">
        <div class="form-group">
          <label class="form-label" for="commentContent">댓글 작성</label>
          <textarea class="form-control form-control--textarea" id="commentContent"
                    th:field="*{content}" style="min-height:96px"
                    placeholder="댓글을 입력하세요" maxlength="500" required></textarea>
          <p class="field-error" th:errors="*{content}"></p>
        </div>
        <div class="cluster cluster--between">
          <span class="text-muted">등록한 댓글은 수정할 수 없습니다.</span>
          <button class="btn btn--primary" type="submit">댓글 등록</button>
        </div>
      </form>

      <p class="note" sec:authorize="isAnonymous()"
         th:if="${!canComment and !post.blocked}">
        <a th:href="@{/login}">로그인하면 댓글을 쓸 수 있습니다.</a>
      </p>
    </section>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
