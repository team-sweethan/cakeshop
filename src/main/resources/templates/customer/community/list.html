<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커뮤니티 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="커뮤니티">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container">

    <div th:replace="~{fragments/common/alert :: alert}"></div>

    <div class="cluster cluster--between">
      <h1>커뮤니티</h1>
      <a class="btn btn--primary" sec:authorize="!hasRole('ADMIN')"
         th:href="@{/community/new}">글쓰기</a>
    </div>

    <section class="section" th:if="${!noticeSection.isEmpty()}">
      <div class="cluster cluster--between">
        <h2>공지사항</h2>
        <a class="btn" th:href="@{/community/notices}">전체보기</a>
      </div>

      <div class="stack">
        <a class="panel cluster cluster--between"
           th:each="notice : ${noticeSection.notices}"
           th:href="@{/community/notices/{noticeId}(noticeId=${notice.id})}">
          <strong th:text="${notice.title}">제목</strong>
          <span class="text-muted"
                th:text="${#temporals.format(notice.displayedAt, 'yyyy.MM.dd')}">2026.01.01</span>
        </a>
      </div>
    </section>

    <section class="section" th:if="${!popularSection.isEmpty()}">
      <div class="cluster">
        <h2>인기글</h2>
        <span class="text-muted">
          <span th:text="${#temporals.format(popularSection.rankingDate, 'yyyy.MM.dd')}">2026.01.01</span> 기준
        </span>
      </div>

      <div class="stack">
        <a class="panel cluster"
           th:each="popular : ${popularSection.posts}"
           th:href="@{/community/{postId}(postId=${popular.postId})}">
          <span class="text-muted" th:text="${popular.ranking}">1</span>
          <span class="badge badge--info" th:text="${popular.categoryName}">카테고리</span>
          <strong th:text="${popular.title}">제목</strong>
        </a>
      </div>
    </section>

    <div class="cluster section">
      <a class="btn"
         th:classappend="${selectedCategoryId == null} ? ' is-active'"
         th:href="@{/community(sort=${selectedSort})}">전체</a>

      <a class="btn"
         th:each="category : ${categories}"
         th:text="${category.name}"
         th:classappend="${selectedCategoryId != null
                           and selectedCategoryId == category.id} ? ' is-active'"
         th:href="@{/community(categoryId=${category.id}, sort=${selectedSort})}">카테고리</a>
    </div>

    <div class="cluster section">
      <a class="btn"
         th:each="sortOption : ${sortOptions}"
         th:classappend="${selectedSort == sortOption} ? ' is-active'"
         th:href="@{/community(categoryId=${selectedCategoryId}, sort=${sortOption.parameter})}"
         th:text="${sortOption.label}">정렬</a>
    </div>

    <div class="stack">
      <article class="panel" th:each="post : ${pageResult.content}">
        <div class="cluster cluster--between">
          <div class="cluster">
            <span class="badge badge--info" th:text="${post.categoryName}">카테고리</span>
            <a th:href="@{/community/{postId}(postId=${post.id})}">
              <strong th:text="${post.title}">제목</strong>
            </a>
          </div>
          <span class="text-muted" th:text="'좋아요 ' + ${post.likeCount}">좋아요 0</span>
        </div>
        <p class="text-muted">
          <span th:text="${post.authorName()}">작성자</span> ·
          <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">2026.01.01</span> ·
          <span th:text="'댓글 ' + ${post.commentCount}">댓글 0</span> ·
          <span th:text="'조회 ' + ${post.viewCount}">조회 0</span>
        </p>
      </article>

      <div class="panel panel--dashed text-muted"
           th:if="${pageResult.content.isEmpty()}"
           style="text-align:center">
        아직 등록된 글이 없습니다.
      </div>
    </div>

    <nav th:if="${pageResult.totalPages > 1}"
         class="cluster section"
         aria-label="페이지 이동"
         style="justify-content:center">

      <a class="btn"
         th:if="${pageNavigation.hasPreviousBlock}"
         th:href="@{/community(
             categoryId=${selectedCategoryId},
             sort=${selectedSort},
             page=${pageNavigation.previousPage}
         )}">
        이전
      </a>

      <span class="btn btn--disabled"
            th:unless="${pageNavigation.hasPreviousBlock}">
        이전
      </span>

      <a class="btn"
         th:each="pageNumber :
             ${#numbers.sequence(
                 pageNavigation.startPage,
                 pageNavigation.endPage
             )}"
         th:text="${pageNumber}"
         th:classappend="${pageNumber == pageResult.page} ? ' is-active'"
         th:href="@{/community(
             categoryId=${selectedCategoryId},
             sort=${selectedSort},
             page=${pageNumber}
         )}">
        1
      </a>

      <a class="btn"
         th:if="${pageNavigation.hasNextBlock}"
         th:href="@{/community(
             categoryId=${selectedCategoryId},
             sort=${selectedSort},
             page=${pageNavigation.nextPage}
         )}">
        다음
      </a>

      <span class="btn btn--disabled"
            th:unless="${pageNavigation.hasNextBlock}">
        다음
      </span>
    </nav>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
