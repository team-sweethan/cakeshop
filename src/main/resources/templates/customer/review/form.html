<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>후기 작성 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="후기 작성">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--form">
    <h1>후기 작성</h1>

    <section class="section">
      <h2 class="section-title">주문 상품</h2>
      <div class="panel">
        <strong th:text="${target.productName()}">상품명</strong>
        <p class="text-muted">
          <span th:text="${target.orderNumber()}">주문번호</span> ·
          <span th:text="${#temporals.format(target.pickedUpAt(), 'yyyy.MM.dd')} + ' 픽업 완료'">2026.01.01 픽업 완료</span>
        </p>
      </div>
    </section>

    <form method="post" th:object="${reviewWriteForm}" th:action="@{/reviews}">
      <input type="hidden" th:field="*{orderItemId}">

      <section class="section">
        <h2 class="section-title">평점 선택</h2>
        <div class="panel stack">
          <div class="form-group">
            <span class="form-label">전체 <span class="required">*</span></span>
            <span class="cluster">
              <label th:each="score : ${#numbers.sequence(1, 5)}">
                <input type="radio" th:field="*{overallRating}" th:value="${score}">
                <span th:text="${score} + '점'">1점</span>
              </label>
            </span>
            <p class="field-error" th:errors="*{overallRating}"></p>
          </div>

          <div class="form-group">
            <span class="form-label">맛 <span class="required">*</span></span>
            <span class="cluster">
              <label th:each="score : ${#numbers.sequence(1, 5)}">
                <input type="radio" th:field="*{tasteRating}" th:value="${score}">
                <span th:text="${score} + '점'">1점</span>
              </label>
            </span>
            <p class="field-error" th:errors="*{tasteRating}"></p>
          </div>

          <div class="form-group">
            <span class="form-label">디자인 <span class="required">*</span></span>
            <span class="cluster">
              <label th:each="score : ${#numbers.sequence(1, 5)}">
                <input type="radio" th:field="*{designRating}" th:value="${score}">
                <span th:text="${score} + '점'">1점</span>
              </label>
            </span>
            <p class="field-error" th:errors="*{designRating}"></p>
          </div>

          <div class="form-group">
            <span class="form-label">응대 <span class="required">*</span></span>
            <span class="cluster">
              <label th:each="score : ${#numbers.sequence(1, 5)}">
                <input type="radio" th:field="*{serviceRating}" th:value="${score}">
                <span th:text="${score} + '점'">1점</span>
              </label>
            </span>
            <p class="field-error" th:errors="*{serviceRating}"></p>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">후기 내용</h2>
        <div class="panel">
          <div class="form-group">
            <label class="form-label" for="content">내용 <span class="required">*</span></label>
            <textarea class="form-control form-control--textarea" id="content" th:field="*{content}"
                      style="min-height:220px" placeholder="후기를 작성해 주세요 (최소 10자 이상)"
                      minlength="10" maxlength="2000" required></textarea>
            <p class="field-error" th:errors="*{content}"></p>
          </div>
        </div>
      </section>

      <div class="cluster cluster--between section">
        <a class="btn" th:href="@{/mypage/reviews/writable}">취소</a>
        <button class="btn btn--primary" type="submit">후기 등록</button>
      </div>
    </form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
