<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>후기 작성 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body data-page-title="후기 작성">
  <header th:replace="~{fragments/common/header :: header}"></header>

  <main class="page-container page-container--form">
    <h1>후기 작성</h1>

    <section class="section">
      <h2 class="section-title">주문 상품</h2>
      <div class="panel">
        <strong th:text="${target.productName}">상품명</strong>
        <p class="text-muted">
          <span th:text="${target.orderNumber}">주문번호</span> | 픽업 완료
        </p>
      </div>
    </section>

    <form th:action="@{/reviews}"
          th:object="${reviewWriteForm}"
          method="post">

      <!-- 상품 식별자는 넘기지 않는다. 서버가 order_items 에서 파생시킨다 (R4). -->
      <input type="hidden" th:field="*{orderItemId}">

      <section class="section">
        <h2 class="section-title">평점 선택</h2>

        <div class="panel stack">
          <!-- 기본 선택을 두지 않는다. 손대지 않은 값이 그대로 저장되면 상품 평균에 섞인다
               (DOMAIN 2.2). -->
          <div class="form-group">
            <label class="form-label" for="overall-rating">
              전체 <span class="required">*</span>
            </label>
            <select class="form-control" id="overall-rating" th:field="*{overallRating}">
              <option value="">선택</option>
              <option th:each="score : ${#numbers.sequence(1, 5)}"
                      th:value="${score}"
                      th:text="${score} + '점'">1점</option>
            </select>
            <p class="form-error" th:if="${#fields.hasErrors('overallRating')}"
               th:errors="*{overallRating}">평점 오류</p>
          </div>

          <div class="form-group">
            <label class="form-label" for="taste-rating">
              맛 <span class="required">*</span>
            </label>
            <select class="form-control" id="taste-rating" th:field="*{tasteRating}">
              <option value="">선택</option>
              <option th:each="score : ${#numbers.sequence(1, 5)}"
                      th:value="${score}"
                      th:text="${score} + '점'">1점</option>
            </select>
            <p class="form-error" th:if="${#fields.hasErrors('tasteRating')}"
               th:errors="*{tasteRating}">평점 오류</p>
          </div>

          <div class="form-group">
            <label class="form-label" for="design-rating">
              디자인 <span class="required">*</span>
            </label>
            <select class="form-control" id="design-rating" th:field="*{designRating}">
              <option value="">선택</option>
              <option th:each="score : ${#numbers.sequence(1, 5)}"
                      th:value="${score}"
                      th:text="${score} + '점'">1점</option>
            </select>
            <p class="form-error" th:if="${#fields.hasErrors('designRating')}"
               th:errors="*{designRating}">평점 오류</p>
          </div>

          <div class="form-group">
            <label class="form-label" for="service-rating">
              응대 <span class="required">*</span>
            </label>
            <select class="form-control" id="service-rating" th:field="*{serviceRating}">
              <option value="">선택</option>
              <option th:each="score : ${#numbers.sequence(1, 5)}"
                      th:value="${score}"
                      th:text="${score} + '점'">1점</option>
            </select>
            <p class="form-error" th:if="${#fields.hasErrors('serviceRating')}"
               th:errors="*{serviceRating}">평점 오류</p>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">후기 내용</h2>
        <div class="panel">
          <div class="form-group">
            <label class="form-label" for="review-content">
              내용 <span class="required">*</span>
            </label>
            <textarea class="form-control form-control--textarea"
                      id="review-content"
                      th:field="*{content}"
                      minlength="10"
                      maxlength="2000"
                      placeholder="후기를 작성해 주세요 (최소 10자 이상)"
                      required></textarea>
            <p class="form-error" th:if="${#fields.hasErrors('content')}"
               th:errors="*{content}">내용 오류</p>
          </div>
        </div>
      </section>

      <div class="cluster">
        <button class="btn btn--primary" type="submit">후기 등록</button>
        <a class="btn" th:href="@{/mypage/reviews/writable}">취소</a>
      </div>
    </form>
  </main>

  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
