설명 : 픽업 완료했고 아직 후기를 쓰지 않은 주문 상품을 보여 준다. 목록이 비는 것은 정상이다.

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작성할 후기 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="작성할 후기">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container">
    <h1>작성할 후기</h1>

    <div class="stack section">
      <article class="panel cluster"
               th:each="item : ${pageResult.content}"
               style="justify-content:space-between">
        <div>
          <strong th:text="${item.productName()}">상품명</strong>
          <p class="text-muted">
            <span th:text="${item.orderNumber()}">주문번호</span> ·
            <span th:text="${#temporals.format(item.pickedUpAt(), 'yyyy.MM.dd')} + ' 픽업 완료'">2026.01.01 픽업 완료</span>
          </p>
        </div>

        <a class="btn btn--primary"
           th:href="@{/reviews/new(orderItemId=${item.orderItemId()})}">
          후기 쓰기
        </a>
      </article>

      <div class="panel panel--dashed text-muted"
           th:if="${pageResult.content.isEmpty()}"
           style="text-align:center">
        작성할 후기가 없습니다.
      </div>
    </div>

    <nav th:if="${pageResult.totalPages > 1}"
         class="cluster section"
         aria-label="페이지 이동"
         style="justify-content:center">

      <a class="btn"
         th:if="${pageNavigation.hasPreviousBlock}"
         th:href="@{/mypage/reviews/writable(page=${pageNavigation.previousPage})}">
        이전
      </a>

      <span class="btn btn--disabled"
            th:unless="${pageNavigation.hasPreviousBlock}">
        이전
      </span>

      <a class="btn"
         th:each="pageNumber :
             ${#numbers.sequence(
                 pageNavigation.startPage,
                 pageNavigation.endPage
             )}"
         th:text="${pageNumber}"
         th:classappend="${pageNumber == pageResult.page} ? ' is-active'"
         th:href="@{/mypage/reviews/writable(page=${pageNumber})}">
        1
      </a>

      <a class="btn"
         th:if="${pageNavigation.hasNextBlock}"
         th:href="@{/mypage/reviews/writable(page=${pageNavigation.nextPage})}">
        다음
      </a>

      <span class="btn btn--disabled"
            th:unless="${pageNavigation.hasNextBlock}">
        다음
      </span>
    </nav>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
