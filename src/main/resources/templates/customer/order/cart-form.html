<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문서 | 케이크샵</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/customer-mockup.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
  <script defer th:src="@{/js/order-checkout.js}"></script>
</head>
<body data-page-title="주문서">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container">
    <h1>주문서 작성</h1>
    <form class="layout-main-aside" method="post" th:action="@{/orders/general/cart}" th:object="${orderForm}">
      <input type="hidden" th:field="*{requestKey}">
      <input type="hidden" th:field="*{displayedOriginalAmount}">
      <input th:each="itemId : *{cartItemIds}" type="hidden" name="cartItemIds" th:value="${itemId}">

      <div class="stack">
        <p class="form-error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>
        <section>
          <h2 class="section-title">주문 상품</h2>
          <div class="panel stack" data-order-items>
            <article class="stack" th:each="item : ${checkout.items}">
              <strong th:text="${item.productName}">상품명</strong>
              <p class="text-muted" th:text="|수량 ${item.quantity}개|">수량 1개</p>
              <div th:if="${!item.selectedOptions.isEmpty()}">
                <div class="data-row" th:each="option : ${item.selectedOptions}">
                  <span class="data-row__label" th:text="${option.groupName}">옵션</span>
                  <span th:text="|${option.name} (+${#numbers.formatInteger(option.additionalPrice, 1, 'COMMA')}원)|">옵션</span>
                </div>
              </div>
              <strong th:text="|${#numbers.formatInteger(item.totalAmount, 1, 'COMMA')}원|">0원</strong>
            </article>
          </div>
        </section>

        <section>
          <h2 class="section-title">픽업 일시</h2>
          <div class="panel stack" data-pickup-scheduler>
            <div class="form-group" th:if="${!checkout.pickupDates.isEmpty()}">
              <label class="form-label" for="pickupDate">픽업 날짜</label>
              <select class="form-control" id="pickupDate" data-pickup-date>
                <option th:each="pickupDate : ${checkout.pickupDates}" th:value="${pickupDate.date}" th:text="${pickupDate.label}"></option>
              </select>
            </div>
            <fieldset class="pickup-choice" th:each="pickupDate, dateStat : ${checkout.pickupDates}"
                      th:attr="data-pickup-time-panel=${pickupDate.date}" th:hidden="${!dateStat.first}">
              <legend class="form-label">픽업 시간</legend>
              <div class="grid grid--4 pickup-choice__times">
                <span th:each="pickupTime, timeStat : ${pickupDate.times}">
                  <input class="pickup-choice__input visually-hidden" type="radio" th:field="*{pickupAt}"
                         th:id="|pickupAt-${dateStat.index}-${timeStat.index}|" th:value="${pickupTime.value}">
                  <label class="btn pickup-choice__label" th:for="|pickupAt-${dateStat.index}-${timeStat.index}|" th:text="${pickupTime.label}"></label>
                </span>
              </div>
            </fieldset>
            <p class="form-error" th:if="${#fields.hasErrors('pickupAt')}" th:errors="*{pickupAt}"></p>
          </div>
        </section>

        <section>
          <h2 class="section-title">쿠폰</h2>
          <div class="panel">
            <label class="form-label" for="memberCouponId">적용 쿠폰</label>
            <select class="form-control" id="memberCouponId" th:field="*{memberCouponId}">
              <option value="">쿠폰을 선택하지 않음</option>
              <option th:each="coupon : ${availableCoupons}" th:value="${coupon.memberCouponId}"
                      th:attr="data-discount-type=${coupon.discountType},data-discount-value=${coupon.discountValue},data-maximum-discount-amount=${coupon.maximumDiscountAmount}"
                      th:text="${coupon.name}"></option>
            </select>
          </div>
        </section>

        <section>
          <h2 class="section-title">주문자 정보</h2>
          <div class="panel">
            <div class="form-group"><label class="form-label" for="ordererName">주문자 이름 <span class="required">*</span></label><input class="form-control" id="ordererName" th:field="*{ordererName}" maxlength="50" required></div>
            <div class="form-group"><label class="form-label" for="ordererPhone">주문자 휴대폰 번호 <span class="required">*</span></label><input class="form-control" id="ordererPhone" type="tel" th:field="*{ordererPhone}" maxlength="30" required></div>
            <div class="form-group"><label class="cluster" for="sameAsOrderer"><input id="sameAsOrderer" type="checkbox" th:field="*{sameAsOrderer}" data-same-as-orderer><span>픽업자가 주문자와 같습니다.</span></label></div>
            <div class="form-group"><label class="form-label" for="pickupName">픽업자 이름 <span class="required">*</span></label><input class="form-control" id="pickupName" th:field="*{pickupName}" maxlength="50" required></div>
            <div class="form-group"><label class="form-label" for="pickupPhone">픽업자 휴대폰 번호 <span class="required">*</span></label><input class="form-control" id="pickupPhone" type="tel" th:field="*{pickupPhone}" maxlength="30" required></div>
          </div>
        </section>
        <section><h2 class="section-title">픽업 요청사항</h2><div class="panel"><textarea class="form-control form-control--textarea" th:field="*{requestMessage}" maxlength="1000"></textarea></div></section>
      </div>
      <aside class="order-summary">
        <h2 class="section-title">결제 금액</h2>
        <div class="data-row" data-order-total th:attr="data-original-amount=${checkout.totalAmount}"><span class="data-row__label">쿠폰 할인</span><span data-coupon-discount>0원</span></div>
        <div class="data-row"><span class="data-row__label">상품 금액</span><span th:text="|${#numbers.formatInteger(checkout.productAmount, 1, 'COMMA')}원|"></span></div>
        <div class="data-row"><span class="data-row__label">옵션 추가 금액</span><span th:text="|${#numbers.formatInteger(checkout.optionAmount, 1, 'COMMA')}원|"></span></div>
        <div class="data-row"><span class="data-row__label">예상 최종 결제 금액</span><strong data-final-amount th:text="|${#numbers.formatInteger(checkout.totalAmount, 1, 'COMMA')}원|"></strong></div>
        <button class="btn btn--primary btn--block" type="submit" th:disabled="${checkout.pickupDates.isEmpty()}" style="margin-top:12px">결제하기</button>
      </aside>
    </form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
