spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  application:
    name: cakeshop
  thymeleaf:
    # 배포(rds 등)에서는 템플릿을 캐싱한다. 로컬 개발용 핫리로드는 local 프로필에서 끈다.
    cache: true
  servlet:
    multipart:
      # 매장·상품 등의 이미지 업로드 상한. 기본값(1MB)은 사진에 너무 작다.
      max-file-size: 5MB
      # 상품 이미지 5장과 multipart 부가 데이터를 한 요청으로 받을 수 있게 여유를 둔다.
      max-request-size: 30MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    # 파일명의 타임스탬프는 '만든 시각'이라 머지 순서와 다를 수 있다.
    # 늦게 머지된 낮은 버전도 받아들이지 않으면 validate 가 실패한다.
    out-of-order: true

server:
  tomcat:
    # 파일 input이 있는 폼은 전체가 multipart라 텍스트·체크박스·CSRF까지 모두 part로 계산된다.
    # Tomcat 11 기본 상한(10)은 매장/상품 폼처럼 필드가 많은 화면에서 쉽게 초과되므로 넉넉히 올린다.
    max-part-count: 100

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.cakeshop.domain
  configuration:
    map-underscore-to-camel-case: true

app:
  mockup:
    public-preview: false
  kakao:
    alimtalk:
      enabled: true
      # 솔라피 API Key & API Secret (김민정 계정으로 등록)
      api-key: "NCSEZJCAQK6WEWMB"
      api-secret: "BS7INVLQ3U79TVZ2KLZT0WOYPU5DK40F"
      # 등록한 휴대폰 번호 
      sender-phone: "01099043410"
      # 카카오톡 채널 발신프로필 ID (선택 사항) // 사업자가 없어서 설정 불가능.
      pf-id: ${KAKAO_ALIMTALK_PF_ID:}
  member:
    simple-password-reset-enabled: false
  file:
    # 업로드 파일을 저장할 로컬 외부 디렉토리 (프로젝트 밖). .env 의 FILE_UPLOAD_DIR 로 지정.
    upload-dir: ${FILE_UPLOAD_DIR:${user.home}/cakeshop-uploads}
    # 저장 파일에 접근하는 웹 경로 접두. WebConfig 리소스 핸들러와 짝을 이룬다.
    url-prefix: /uploads

---
# 기본 개발 환경: 각 PC에 직접 설치한 MariaDB
spring:
  config:
    activate:
      on-profile: local
  # 로컬 개발에서는 템플릿 수정 즉시 반영되도록 캐시를 끈다.
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:mariadb://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT}/${LOCAL_DB_DATABASE}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
app:
  mockup:
    # 화면 선이관 기간에만 조회 화면을 로그인 없이 확인한다. rds에서는 false다.
    public-preview: true
  member:
    # 이메일/SMS 인증을 연결하기 전 로컬 기능 확인용 간편 재설정이다.
    simple-password-reset-enabled: true

---
# 공용 AWS RDS: 프로젝트 루트의 .env에서 접속 정보를 읽는다.
spring:
  config:
    activate:
      on-profile: rds
  datasource:
    # 공용 개발 RDS의 require_secure_transport=ON 대응: TLS로 암호화해 연결한다.
    url: "jdbc:mariadb://${RDS_ENDPOINT}:${RDS_PORT:3306}/${RDS_DATABASE}?sslMode=trust"
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
  flyway:
    # 애플리케이션 기동으로 공용 RDS 스키마가 변경되지 않도록 차단한다.
    # RDS 스키마 변경은 검토·승인된 별도 반영 절차로만 수행한다.
    enabled: false
app:
  member:
    simple-password-reset-enabled: false
