plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cakeshop'
version = '0.0.1-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // Spring Boot 4부터 @WebMvcTest 슬라이스가 별도 모듈로 분리되었다.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testImplementation 'org.springframework.security:spring-security-test'
    // MockMvc에 Security 필터체인/@WithMockUser를 연결한다 (Boot 4에서 별도 모듈)
    testImplementation 'org.springframework.boot:spring-boot-security-test'
    testImplementation 'org.testcontainers:testcontainers-mariadb'
}

// 소스에 한글 주석과 안내 메시지가 있다. JVM 기본 인코딩(Windows 에서 MS949)에 맡기면
// 컴파일하는 PC 에 따라 문자열이 깨진다.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// 실행 시점도 마찬가지다. 테스트 JVM 의 기본 문자셋을 그냥 두면 @Sql 시드나
// 파일로 읽는 리소스의 한글이 Windows 에서 MS949 로 해석돼 깨진다.
tasks.withType(Test).configureEach { defaultCharacterEncoding = 'UTF-8' }
tasks.withType(JavaExec).configureEach { defaultCharacterEncoding = 'UTF-8' }

tasks.named('test') {
    useJUnitPlatform()

    // CommunityScreenDocTests 는 docs/ 의 문서를 읽어 화면과 대조한다. Gradle 은 소스와
    // 리소스만 입력으로 보므로, 등록해 두지 않으면 문서만 고쳤을 때 test 가 UP-TO-DATE 로
    // 건너뛴다. 그러면 문서가 어긋나도 로컬에서는 초록불이 뜬다.
    inputs.files(fileTree('docs'))
            .withPropertyName('projectDocs')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // 같은 이유로 테스트 소스 원문도 등록한다. 이 하네스는 컴파일된 클래스가 아니라
    // src/test/java 의 원문을 파싱해 "문서가 가리키는 테스트가 그 문구를 있다고 단언하는가"를
    // 본다. 그래서 바이트코드가 같은 수정(공백, 주석, 괄호 자리)이 검사 결과를 바꾸는데,
    // 등록해 두지 않으면 Gradle 이 UP-TO-DATE 로 건너뛰어 로컬에서만 초록불이 남는다.
    inputs.files(fileTree('src/test/java'))
            .withPropertyName('testSources')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // 도메인 경계 하네스(H34)도 컴파일된 클래스가 아니라 src/main/java 의 원문을 읽는다.
    // 쓰지 않는 import 하나를 되살리는 변경은 검사 결과를 바꾸지만 바이트코드는 그대로라,
    // 등록해 두지 않으면 Gradle 이 test 를 UP-TO-DATE 로 건너뛴다. CI 는 clean test 라
    // 무사하지만 로컬에서만 초록불이 남는 자리다 (PR #144 Codex 리뷰).
    inputs.files(fileTree('src/main/java'))
            .withPropertyName('mainSources')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

// 마이그레이션 파일명을 사람이 정하면 여러 브랜치에서 같은 버전이 나온다.
// 버전은 생성 시각으로 찍고, 개발자는 설명만 넘긴다.
//   gradlew newMigration -Pdesc=add_coupon_table
tasks.register('newMigration') {
    group = 'cakeshop'
    description = '타임스탬프 규칙에 맞는 빈 Flyway migration 파일을 만든다. 예: -Pdesc=add_coupon_table'

    // configuration cache 대응: 설정 시점 값만 캡처하고 doLast 안에서 project를 참조하지 않는다.
    def migrationDir = layout.projectDirectory.dir('src/main/resources/db/migration').asFile
    def projectDir = layout.projectDirectory.asFile
    def descProvider = providers.gradleProperty('desc')

    doLast {
        def desc = descProvider.getOrNull()
        // Windows 콘솔 코드페이지에 따라 한글이 깨질 수 있어 실행에 필요한 정보는 ASCII 로 적는다.
        if (!desc?.trim()) {
            throw new GradleException(
                    'usage: gradlew newMigration -Pdesc=<snake_case_description>\n' +
                    '  e.g. gradlew newMigration -Pdesc=add_coupon_table'
            )
        }
        if (!(desc ==~ /[a-z0-9]+(_[a-z0-9]+)*/)) {
            throw new GradleException(
                    "-Pdesc must be lower snake_case, but was '${desc}'\n" +
                    '  e.g. add_coupon_table, drop_legacy_index'
            )
        }

        def formatter = java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd_HHmmss')
        def existing = (migrationDir.listFiles() ?: new File[0])*.name
        def stamp = java.time.LocalDateTime.now()
        // 같은 초에 만들어진 마이그레이션이 이미 있으면 버전이 겹친다.
        // 설명이 달라도 Flyway 버전은 같으므로 파일명 전체가 아니라 버전 접두어로 확인한다.
        while (existing.any { it.startsWith('V' + stamp.format(formatter) + '__') }) {
            stamp = stamp.plusSeconds(1)
        }

        def target = new File(migrationDir, "V${stamp.format(formatter)}__${desc}.sql")
        migrationDir.mkdirs()
        target.setText("""\
-- ${desc}
-- 생성: ${stamp.format(java.time.format.DateTimeFormatter.ofPattern('yyyy-MM-dd HH:mm:ss'))}
--
-- 규칙
-- * 이 파일은 머지된 뒤 절대 수정하지 않는다. 변경이 필요하면 새 migration 을 만든다.
-- * 로컬 샘플 데이터는 여기 넣지 않는다. db/seed/seed-local.sql 을 쓴다.
-- * 서로 의존하는 DDL 은 파일을 나누지 말고 이 파일에 함께 담는다.

""", 'UTF-8')

        println "created: ${projectDir.toPath().relativize(target.toPath()).toString().replace('\\', '/')}"
    }
}
