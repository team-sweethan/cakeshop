# 로컬 측정용 관측 스택. 배포에 쓰지 않는다.
#
# 앱은 호스트에서 직접 뜨고(bootJar + java -jar) 수집기만 컨테이너다.
# 그래서 Prometheus 가 앱을 긁을 때 localhost 가 아니라 host.docker.internal 을 본다.
#
# 실행: monitoring 디렉터리에서 docker compose up -d
# 사용법과 확인 절차는 같은 폴더의 README.md 에 있다.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: cakeshop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Docker Desktop 이 아닌 리눅스 엔진에서도 host.docker.internal 이 풀리게 한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: cakeshop-grafana
    ports:
      - "3000:3000"
    environment:
      # 로컬 전용이라 로그인 없이 바로 본다. 이 스택을 외부에 열지 않는다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
