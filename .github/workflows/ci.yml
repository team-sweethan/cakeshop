name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 이미 머지된 Flyway migration 은 절대 수정하지 않는다는 규칙(newMigration 템플릿 참조)을
  # 사람의 주의력이 아니라 CI 로 강제한다. 어기면 체크섬이 어긋나 다른 개발자의 로컬 부팅이
  # 깨지는데, 그때는 이미 머지된 뒤라 되돌리기가 훨씬 비싸다.
  # DB 가 필요 없는 검사라 test 와 분리해 먼저 빨간불이 뜨게 둔다.
  migration-guard:
    name: Migration immutability
    # base 브랜치와 비교해야 성립하는 검사다. push 이벤트에는 비교 대상이 없다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # merge-base 를 계산하려면 base 브랜치의 이력이 있어야 한다. 기본값(1)로는 없다.
          fetch-depth: 0

      - name: Ensure merged migrations are unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # 소문자 a 는 '추가(A)를 제외한 전부'다. 막을 상태를 열거하면(MDR 등) 빠뜨린 것이
          # 그대로 구멍이 된다. 실제로 T(파일 형식 변경, 예: SQL 을 심볼릭 링크로 교체)는
          # MDR 에 걸리지 않는다. 규칙의 본뜻이 "추가 외에는 허용하지 않는다" 이므로 그대로 적는다.
          # 세 점(...)은 merge-base 기준이라, base 브랜치가 앞서 나가도 오탐이 없다.
          changed=$(git diff --diff-filter=a --name-only "$BASE_SHA...HEAD" -- src/main/resources/db/migration)
          if [ -n "$changed" ]; then
            echo "::error::이미 머지된 migration 을 수정/삭제/이름변경했습니다. 되돌리고 새 migration 을 추가하세요 (gradlew newMigration -Pdesc=...)."
            echo "$changed" | while read -r f; do echo "::error file=$f::머지된 migration 은 수정할 수 없습니다"; done
            exit 1
          fi
          echo "머지된 migration 변경 없음"

  unit_test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew unitTest

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/unitTest/
            build/test-results/unitTest/
          if-no-files-found: ignore
          retention-days: 7

  mariadb_test:
    name: MariaDB tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Docker
        run: docker info

      - name: Run MariaDB tests
        run: ./gradlew mariaDbTest

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mariadb-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/mariaDbTest/
            build/test-results/mariaDbTest/
          if-no-files-found: ignore
          retention-days: 7

  # dev branch protection이 요구하는 기존 `Test` 체크 이름을 유지하면서 두 병렬 잡의 결과를 합친다.
  test:
    name: Test
    if: always()
    needs:
      - unit_test
      - mariadb_test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify split test jobs
        env:
          UNIT_TEST_RESULT: ${{ needs.unit_test.result }}
          MARIADB_TEST_RESULT: ${{ needs.mariadb_test.result }}
        run: |
          if [ "$UNIT_TEST_RESULT" != "success" ] || [ "$MARIADB_TEST_RESULT" != "success" ]; then
            echo "::error::Unit tests=$UNIT_TEST_RESULT, MariaDB tests=$MARIADB_TEST_RESULT"
            exit 1
          fi
          echo "Unit tests and MariaDB tests succeeded"
