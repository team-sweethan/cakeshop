name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 이미 머지된 Flyway migration 은 절대 수정하지 않는다는 규칙(newMigration 템플릿 참조)을
  # 사람의 주의력이 아니라 CI 로 강제한다. 어기면 체크섬이 어긋나 다른 개발자의 로컬 부팅이
  # 깨지는데, 그때는 이미 머지된 뒤라 되돌리기가 훨씬 비싸다.
  # DB 가 필요 없는 검사라 test 와 분리해 먼저 빨간불이 뜨게 둔다.
  migration-guard:
    name: Migration immutability
    # base 브랜치와 비교해야 성립하는 검사다. push 이벤트에는 비교 대상이 없다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # merge-base 를 계산하려면 base 브랜치의 이력이 있어야 한다. 기본값(1)로는 없다.
          fetch-depth: 0

      - name: Ensure merged migrations are unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # M(수정) D(삭제) R(이름변경)만 잡는다. A(추가)는 정상적인 새 migration 이다.
          # 세 점(...)은 merge-base 기준이라, base 브랜치가 앞서 나가도 오탐이 없다.
          changed=$(git diff --diff-filter=MDR --name-only "$BASE_SHA...HEAD" -- src/main/resources/db/migration)
          if [ -n "$changed" ]; then
            echo "::error::이미 머지된 migration 을 수정/삭제/이름변경했습니다. 되돌리고 새 migration 을 추가하세요 (gradlew newMigration -Pdesc=...)."
            echo "$changed" | while read -r f; do echo "::error file=$f::머지된 migration 은 수정할 수 없습니다"; done
            exit 1
          fi
          echo "머지된 migration 변경 없음"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Docker
        run: docker info

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7
