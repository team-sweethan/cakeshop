name: Branch Status

# 브랜치 현황 문서(docs/branch_update.md)와 HTML 요약(docs/branch_status.html)을
# 매일 다시 만들어 PR로 올린다.
# dev 에 직접 push 하지 않고, chore/branch-status 브랜치 하나를 계속 덮어쓴다.

on:
  schedule:
    # GitHub 의 cron 은 UTC 기준이다. 15:00 UTC = 다음 날 00:00 KST.
    # 러너가 붐비면 수십 분 밀릴 수 있어 정각은 보장되지 않는다.
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: branch-status
  cancel-in-progress: false

jobs:
  update:
    name: Update branch status doc
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DOC: docs/branch_update.md
      HTML: docs/branch_status.html
      WORK_BRANCH: chore/branch-status
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: dev
          # 브랜치 간 앞/뒤 커밋 수를 세려면 전체 히스토리가 필요하다.
          fetch-depth: 0

      - name: Generate document
        # 작업 브랜치는 이 문서를 담는 그릇일 뿐이고, 문서를 만든 직후 커밋이 얹혀서
        # 기록된 SHA 와 앞선 커밋 수가 곧바로 어긋난다. 보고 대상에서 뺀다.
        env:
          EXCLUDE_BRANCH: ${{ env.WORK_BRANCH }}
        run: ./.github/scripts/branch-status.sh "$DOC" "$HTML"

      # GITHUB_TOKEN 이 연 PR 에는 ci.yml 이 돌지 않는다. 대신 PR 을 열기 전에 여기서
      # 검증한다. 이 PR 이 생성 대상 문서 두 개만 바꾼다는 사실 자체가 검증 대상이다.
      - name: Verify only the documents changed
        run: |
          # git diff 는 추적 중인 파일만 본다. 생성 대상이 아직 커밋된 적 없으면
          # untracked 로 남아 diff 에 잡히지 않으므로, 여기서는 status 로 본다.
          changed="$(git status --porcelain --untracked-files=all | cut -c4-)"
          unexpected="$(printf '%s' "$changed" | grep -v -x -e "$DOC" -e "$HTML" || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::$DOC, $HTML 외의 파일이 바뀌었다. 이 워크플로는 이 두 문서만 갱신해야 한다."
            echo "$unexpected"
            exit 1
          fi
          bash -n ./.github/scripts/branch-status.sh

      - name: Stop if unchanged
        id: diff
        run: |
          # 위와 같은 이유로 diff 가 아니라 status 로 판단한다. diff 로 보면 아직
          # 커밋된 적 없는 생성물이 "변경 없음" 으로 읽혀 영영 커밋되지 않는다.
          if [ -z "$(git status --porcelain --untracked-files=all -- "$DOC" "$HTML")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음. PR 을 만들지 않는다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit to work branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$WORK_BRANCH"
          git add "$DOC" "$HTML"
          git commit -m "docs: 브랜치 현황 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push --force origin "$WORK_BRANCH"

      # GITHUB_TOKEN 이 연 PR 에는 ci.yml 이 돌지 않는다(토큰이 만든 이벤트는 다른
      # 워크플로를 깨우지 않는다). 검증은 위의 "Verify only the documents changed"
      # 스텝이 대신하며, 바뀌는 것이 생성 대상 문서 두 개뿐이라 Gradle 테스트로 검증할
      # 대상이 없다는 사실 자체를 거기서 강제한다.
      #
      # dev 에 branch protection 을 걸어 ci.yml 을 필수 체크로 만들면 이 PR 은 머지할
      # 수 없게 된다. 그때는 PAT 이나 GitHub App 토큰으로 바꿔야 한다.
      - name: Open pull request if none is open
        if: steps.diff.outputs.changed == 'true'
        run: |
          if [ -n "$(gh pr list --head "$WORK_BRANCH" --base dev --state open --json number --jq '.[].number')" ]; then
            echo "이미 열려 있는 PR 에 새 커밋이 실렸다."
          else
            gh pr create \
              --base dev \
              --head "$WORK_BRANCH" \
              --title "docs: 브랜치 현황 자동 갱신" \
              --body-file - <<BODY
          ## 변경 목적

          브랜치 현황 문서를 최신 상태로 유지한다. 이 PR 은
          \`.github/workflows/branch-status.yml\` 이 매일 00시(KST)에 자동으로 연다.

          ## 주요 변경 사항

          - \`$DOC\` 와 \`$HTML\` 두 파일만 다시 생성했다. 내용은 전부 Git
            메타데이터에서 나오며 사람이 쓴 문장은 없다.
          - 두 파일은 같은 수집 결과에서 나오므로 서로 다른 시점을 가리키지 않는다.
          - 생성 로직은 \`.github/scripts/branch-status.sh\` 에 있다. 문서가 이상하면
            문서가 아니라 이 스크립트를 고친다.

          ## 테스트 결과

          - 실행 명령: 없음
          - 결과: 해당 없음
          - 미실행 사유: 생성된 문서 두 개만 바뀐다. 애플리케이션 코드, 설정,
            테스트가 포함되지 않아 Gradle 테스트로 검증할 대상이 없다.
            생성 스크립트 자체의 검증은 스크립트를 바꾸는 PR 에서 수행한다.

          ## DB / Flyway 변경

          - [x] 없음
          - [ ] 있음

          - migration: 없음
          - seed (\`db/seed/seed-local.sql\`): 변경 없음
          - 기존 데이터 및 운영 환경 영향: 없음

          ## 리뷰어가 집중해서 볼 부분

          표의 브랜치 목록과 앞/뒤 커밋 수가 실제 저장소 상태와 맞는지 확인한다.
          값이 어긋난다면 생성 시점과 검토 시점 사이에 push 가 있었을 수 있다.

          ## Codex 자동 리뷰

          - [ ] Codex 자동 리뷰가 완료되었습니다.
          - [ ] Codex가 제기한 P0/P1 항목을 해결했거나 처리 근거를 남겼습니다.

          ## 관련 이슈

          없음

          ## 체크리스트

          - [x] 하나의 목적만 포함한 PR입니다.
          - [x] 변경 사항을 self-review했습니다. (자동 생성 문서)
          - [ ] 전체 로컬 테스트를 실행하고 결과를 작성했습니다. (위 사유 참고)
          - [x] 테스트 코드를 추가했거나 미추가 사유를 작성했습니다.
          - [x] DB/Flyway 변경 여부와 영향을 작성했습니다.
          - [x] 기존 Flyway migration을 수정하지 않았습니다.
          - [x] 로컬 seed가 운영 환경에서 실행되지 않는지 확인했습니다.
          - [x] 민감 정보, \`.env\`, 디버그 코드를 포함하지 않았습니다.
          - [x] 코드 컨벤션과 테스트 작성 규칙을 확인했습니다.
          - [x] 관련 문서 변경 필요 여부를 확인했습니다.
          - [x] 다른 담당자의 코드 수정 여부와 합의 내용을 확인했습니다.
          BODY
          fi
